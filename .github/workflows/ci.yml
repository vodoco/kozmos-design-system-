name: CI

on:
  push:
    branches: ["main"]
    # Documentation-only pushes do not need the matrix. This job set includes a `macos-latest`
    # runner, which GitHub bills at 10x minutes — on 2026-08-28 six of eight pushes to main were
    # markdown-only and each ran the full matrix, which is how the spending limit was reached.
    # Deliberately NOT applied to `pull_request`: a required check that never reports blocks a PR.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize]

jobs:
  web:
    name: Web Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # The design system gates on its own lint. apps/mapscale-review is a
      # consumer of the library — a place to use the components for real — and
      # its in-flight work should not block a packages/ change. It is still
      # linted, just in a step that reports without failing the job.
      - name: Lint
        run: pnpm lint --filter=!mapscale-review

      - name: Lint Example App (non-blocking)
        continue-on-error: true
        run: pnpm lint --filter=mapscale-review

      - name: Build Web
        run: pnpm build

      - name: Test Web (Unit & A11y)
        run: pnpm test

      - name: Verify Web Contracts (Pact)
        run: pnpm --filter @kozmos/react test:contracts

      - name: Verify Component Contracts
        run: pnpm components:contract:check

      - name: Verify Token Contrast Contracts
        run: pnpm tokens:contrast:check

      - name: Verify Radius Parity
        run: pnpm tokens:radius:check

      - name: Verify Border Parity
        run: pnpm tokens:border:check

      - name: Verify Elevation Parity
        run: pnpm tokens:elevation:check

      # A ratchet over a known backlog rather than a pass mark. Every other
      # parity check verifies a named list of consumers, which can only confirm
      # what someone already looked at — elevation passed for two days while 44
      # raw shadow classes sat in components it did not name. This one scans
      # everything and fails when a count goes up.
      - name: Verify No New Raw Values
        run: pnpm tokens:raw:check

      # A Tailwind class the build cannot generate is dropped without a word, and
      # a toHaveClass assertion still passes. bg-background/90 left
      # MapControlButton transparent over the map that way. This reads the
      # stylesheet the build step above produced, so it must stay after it.
      - name: Verify No New Classes That Compile To Nothing
        run: pnpm components:classes:check

      # Packs every non-private package, installs the tarballs into an empty
      # project with npm, resolves every export and README import, renders a
      # component and type-checks every README sample. It reads the build above.
      - name: Verify Packages Install From Their Tarballs
        run: pnpm test:declarations && pnpm packages:install:check

      # A stale stamp means the plugin source changed without the build id
      # following, and the id is the only way to tell which build produced what
      # is in the Figma file.
      - name: Verify Figma Plugin Build Stamp
        run: pnpm figma:stamp:check

      # Reads the live Figma file, so it needs the token and is skipped without
      # it. Switched to --strict on 2026-09-03, the day the backlog reached
      # zero — a gate that is red on purpose is a gate somebody switches off.
      - name: Verify Nested Radius
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping nested radius check because FIGMA_ACCESS_TOKEN is not configured."
            exit 0
          fi
          pnpm tokens:radius:nesting --strict

      - name: Verify Typography Parity
        run: pnpm tokens:typography:check

      - name: Verify Documentation Snippets
        run: pnpm docs:snippets:check

      - name: Parse React Code Connect
        run: pnpm figma:parse:linked

      - name: Verify React Code Connect
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping React Code Connect dry-run because FIGMA_ACCESS_TOKEN is not configured."
            exit 0
          fi
          pnpm figma:publish:linked:dry

      - name: Install Playwright
        run: pnpm --filter @kozmos/react exec playwright install --with-deps chromium firefox webkit

      - name: Verify Browser Selection
        run: |
          pnpm test:browser-selection
          pnpm test:css-build
          pnpm test:token-alpha
          ADAPTIVE_BROWSER=firefox pnpm test:token-alpha
          ADAPTIVE_BROWSER=webkit pnpm test:token-alpha

      - name: Verify Built Adaptive Layout Geometry
        run: |
          pnpm test:adaptive
          ADAPTIVE_BROWSER=webkit pnpm test:adaptive
          ADAPTIVE_BROWSER=firefox pnpm test:adaptive

      - name: Verify Built Overlay Ownership
        run: |
          pnpm test:overlays
          ADAPTIVE_BROWSER=webkit pnpm test:overlays
          ADAPTIVE_BROWSER=firefox pnpm test:overlays
          pnpm test:select-accessibility
          ADAPTIVE_BROWSER=webkit pnpm test:select-accessibility
          ADAPTIVE_BROWSER=firefox pnpm test:select-accessibility

      - name: Verify Module Theme and Stylesheet Isolation
        run: |
          pnpm test:themes
          ADAPTIVE_BROWSER=webkit pnpm test:themes
          ADAPTIVE_BROWSER=firefox pnpm test:themes

      - name: Verify Scoped Runtime Configuration
        run: |
          pnpm test:config
          ADAPTIVE_BROWSER=webkit pnpm test:config
          ADAPTIVE_BROWSER=firefox pnpm test:config

      # Keep the original WebKit form regression and independently test the
      # migrated slice with every native @scope rule removed.
      - name: Verify Built Form Control Compatibility
        run: |
          result=0
          for browser in chromium firefox webkit; do
            ADAPTIVE_BROWSER="$browser" pnpm test:browser-compatibility || result=1
            ADAPTIVE_BROWSER="$browser" pnpm test:owned-css || result=1
            ADAPTIVE_BROWSER="$browser" pnpm test:temporal-css || result=1
          done
          exit "$result"

      - name: Core Pipeline - Storybook E2E & A11y Verification
        run: |
          # Chromatic is the required visual-regression gate. Keep local screenshot baselines manual until repaired.
          pnpm --filter @kozmos/docs exec concurrently -k -s first -n "SB,TEST" \
            "pnpm --filter @kozmos/docs storybook:react -- --ci --host 127.0.0.1" \
            "bash -lc 'until curl -sf http://127.0.0.1:6006 >/dev/null; do sleep 2; done; pnpm --filter @kozmos/react exec playwright test && pnpm -w exec tsx scripts/skills/check-a11y.ts && pnpm -w test:storybook-regressions && ADAPTIVE_BROWSER=firefox pnpm -w test:storybook-regressions && ADAPTIVE_BROWSER=webkit pnpm -w test:storybook-regressions'"

      - name: Audit Every React Story and Keyboard Scroll Interaction
        run: |
          pnpm --filter @kozmos/docs exec concurrently -k -s first -n "STATIC,TEST" \
            "python3 -m http.server 6008 --bind 127.0.0.1 --directory storybook-static" \
            "bash -lc 'until curl -sf http://127.0.0.1:6008/index.json >/dev/null; do sleep 2; done; STORY_SCOPE=all STORYBOOK_URL=http://127.0.0.1:6008 pnpm -w test:storybook-audit && STORYBOOK_URL=http://127.0.0.1:6008 pnpm -w test:storybook-interactions && STORYBOOK_URL=http://127.0.0.1:6008 ADAPTIVE_BROWSER=firefox pnpm -w test:storybook-interactions && STORYBOOK_URL=http://127.0.0.1:6008 ADAPTIVE_BROWSER=webkit pnpm -w test:storybook-interactions'"

      - name: Preserve Storybook Audit Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-audit
          path: test-results/storybook-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce SDK Assembly & Accessibility Governance
        run: |
          pnpm exec tsx scripts/skills/check-completion.ts --check

      - name: Verify Proof-of-Output (Web & Tokens)
        run: |
          test -s packages/tokens/dist/css/variables-light.css
          test -s packages/vue/dist/index.d.ts
          node -e "
            const light = require('./packages/tokens/src/tokens-light.json');
            const dark = require('./packages/tokens/src/tokens-dark.json');
            const bgLight = light?.Primitives?.Colors?.background?.['0']?.value || light?.Primitives?.Colors?.background?.['0']?.['\$value'];
            const bgDark = dark?.Primitives?.Colors?.background?.['0']?.value || dark?.Primitives?.Colors?.background?.['0']?.['\$value'];
            if (bgLight === bgDark) {
               console.error('❌ Dark mode tokens match Light mode! Propagation failed.');
               process.exit(1);
            }
            console.log('✅ Dark Mode divergence verified cross-platform.');
          "
  ios:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install JS Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Design Tokens
        run: pnpm --filter @kozmos/tokens build

      - name: Build iOS Package
        working-directory: packages/ios
        run: swift build

      - name: Test iOS Package
        working-directory: packages/ios
        run: swift test

      - name: Parse SwiftUI Code Connect
        run: pnpm figma:parse:ios:linked

      - name: Verify SwiftUI Code Connect
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping SwiftUI Code Connect dry-run because FIGMA_ACCESS_TOKEN is not configured."
            exit 0
          fi
          pnpm figma:publish:ios:linked:dry

      - name: Verify Proof-of-Output (iOS)
        run: test -s packages/tokens/dist/ios/KozmosColors.swift

  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install JS Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Design Tokens
        run: pnpm --filter @kozmos/tokens build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Build Android Library
        working-directory: packages/android
        run: ./gradlew assembleDebug

      - name: Test Android Library
        working-directory: packages/android
        run: ./gradlew verifyPaparazziDebug

      - name: Parse Compose Code Connect
        run: pnpm figma:parse:android:linked

      - name: Verify Compose Code Connect
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping Compose Code Connect dry-run because FIGMA_ACCESS_TOKEN is not configured."
            exit 0
          fi
          pnpm figma:publish:android:linked:dry

      - name: Verify Proof-of-Output (Android)
        run: test -s packages/tokens/dist/android/src/main/java/com/kozmos/tokens/KozmosColors.kt
