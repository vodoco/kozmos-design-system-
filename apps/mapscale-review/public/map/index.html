  let pool = rings.map(r => ringClose(ringOpen(r)));
  let joined = 0;
  for (;;) {
    let best = null;
    for (let a = 0; a < pool.length; a++) {
      for (let b = a + 1; b < pool.length; b++) {
        const br = findBridge(pool[a], pool[b], maxGap);
        if (br && (!best || br.width > best.width)) best = { a, b, width: br.width };
      }
    }
    if (!best) break;
    const merged = bridgeRings(pool[best.a], pool[best.b], maxGap);
    if (!merged) break;
    pool = pool.filter((_, k) => k !== best.a && k !== best.b).concat([merged]);
    joined++;
  }
  return { rings: pool, joined };
}
/* COMBINE-ENGINE-END */

/* ── straighten: square the shape up ───────────────────────────────────────────
   Olcay, 2026-08-16: *"Straighten should normalize should rectangularize or circularize or similar
   shapefy drawings."*

   Rooms are rectilinear. A traced or auto-extracted floor plan is not — its corners land at 88° and
   91°, and every one of those is visible once the plan is drawn over a real building. This pulls a
   shape onto its OWN grid: it finds the direction the shape is already mostly built on, and brings
   the edges that are nearly aligned with it exactly onto it.

   ⚠️ **It squares to the shape's own angle, not to north.** A concourse at 23° to the compass is
   still a rectilinear concourse, and snapping it to the screen axes would be vandalism.

   ⚠️ **Edges that are genuinely diagonal are left alone.** Only edges within `tolDeg` of the grid
   are moved, so a chamfered corner or an angled wall survives — squaring must not invent a
   right angle the building does not have. Circularize is a different operation on a different kind
   of shape and is deliberately not folded in here; see the hand-off. */

/* SQUARE-ENGINE-START — extracted and tested by scratch/geometry.test.mjs; keep DOM- and map-free.
   Depends on `ringOpen` from the split engine, which the harness extracts alongside it. */

/**
 * The direction the shape is mostly built on, folded into a quarter turn and weighted by length.
 *
 * Multiplying by 4 is what does the folding: edges 90° apart land on the same bearing once the
 * circle has been gone round four times, so opposite walls of a room reinforce each other instead
 * of cancelling out. Weighted by length because a long wall says more about a building's grid than
 * a 20cm jog does.
 */
function dominantAngle(rings) {
  let sx = 0, sy = 0;
  for (const r of rings) {
    const open = ringOpen(r);
    for (let i = 0; i < open.length; i++) {
      const a = open[i], b = open[(i + 1) % open.length];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy);
      if (len < 1e-9) continue;
      const ang = Math.atan2(dy, dx) * 4;
      sx += Math.cos(ang) * len;
      sy += Math.sin(ang) * len;
    }
  }
  if (!sx && !sy) return 0;
  return Math.atan2(sy, sx) / 4;
}

/**
 * Square every near-axis edge onto the shape's own grid.
 *
 * Relaxation rather than one pass: a corner belongs to two edges, and satisfying one by moving the
 * corner would break the other. Each pass moves both ends of an edge HALF way onto the line they
 * should share, so the two demands on a corner meet in the middle and converge instead of fighting.
 */
function squareRings(rings, tolDeg, passes) {
  const theta = dominantAngle(rings);
  const rot = (p, c, s) => [p[0] * c - p[1] * s, p[0] * s + p[1] * c];
  const ci = Math.cos(-theta), si = Math.sin(-theta);
  const work = rings.map(r => ringOpen(r).map(p => rot(p, ci, si)));
  const tol = Math.tan(Math.max(0, tolDeg) * Math.PI / 180);
  for (let pass = 0; pass < passes; pass++) {
    for (const ring of work) {
      const n = ring.length;
      for (let i = 0; i < n; i++) {
        const a = ring[i], b = ring[(i + 1) % n];
        const dx = Math.abs(b[0] - a[0]), dy = Math.abs(b[1] - a[1]);
        if (dx < 1e-12 && dy < 1e-12) continue;
        if (dy <= dx * tol) {                    // near-horizontal in the local frame
          const m = (a[1] + b[1]) / 2;
          a[1] += (m - a[1]) * 0.5;
          b[1] += (m - b[1]) * 0.5;
        } else if (dx <= dy * tol) {             // near-vertical
          const m = (a[0] + b[0]) / 2;
          a[0] += (m - a[0]) * 0.5;
          b[0] += (m - b[0]) * 0.5;
        }
      }
    }
  }
  const cb = Math.cos(theta), sb = Math.sin(theta);
  return work.map(r => {
    const out = r.map(p => rot(p, cb, sb));
    out.push(out[0].slice());
    return out;
  });
}
/* SQUARE-ENGINE-END */

/** Square the feature up, in screen space so "nearly aligned" means what it looks like. */
function geomSquare() {
  if (!GEOM || GEOM.kind !== "area" || !GEOM.rings.length) return;
  const scr = GEOM.rings.map(r => r.map(c => { const p = map.project(c); return [p.x, p.y]; }));
  const out = squareRings(scr, 20, 60);
  geomPush();
  GEOM.rings = out.map(r => r.map(([x, y]) => {
    const q = map.unproject([x, y]);
    return [q.lng, q.lat];
  }));
  // Corner count is unchanged, so the selection still points at the same corners.
  geomDraw(); post("geomstate", geomState());
}

function geomSimplify() {
  if (!GEOM || GEOM.kind !== "area") return;
  const TOL = 2.5;
  geomPush();
  GEOM.rings = GEOM.rings.map(r => {
    const open = r.slice(0, -1);            // the closing point is the first one again
    if (open.length <= 3) return r;
    /**
     * ⚠️ **Every vertex is tested, including the first.** This used to skip `i === 0` and
     * `i === r.length - 1` outright — which is right for the *closing* point but wrong for the
     * first, whose neighbours are the last real vertex and the second. A redundant corner that
     * happened to be vertex 0 could never be straightened away, and since a ring's start is
     * arbitrary, which corner that was is pure luck.
     */
    const n = open.length;
    const keep = open.filter((c, i) => {
      const a = map.project(open[(i - 1 + n) % n]);
      const b = map.project(c);
      const d = map.project(open[(i + 1) % n]);
      const len = Math.hypot(d.x - a.x, d.y - a.y) || 1;
      const dist = Math.abs((d.x - a.x) * (a.y - b.y) - (a.x - b.x) * (d.y - a.y)) / len;
      return dist > TOL;
    });
    if (keep.length < 3) return r;
    return keep.concat([keep[0].slice()]);
  });
  // Dropping corners renumbers the rest — see geomClearSel for why pruning would be worse.
  geomClearSel();
  geomDraw(); post("geomstate", geomState());
}

/* ── split ─────────────────────────────────────────────────────────────────────────────────── */

/**
 * Cut a feature's rings with a straight line.
 *
 * This is the operation that was recorded as unbuilt until 2026-08-15, on the grounds that a
 * convex-only version silently mangles a real floor plan. The bar was: walk the ring, insert every
 * intersection, and re-assemble valid rings — **for concave shapes, with multiple crossings**. That
 * is what this does, and `scratch/split-engine.test.mjs` extracts this exact code out of this file
 * and proves it on a U cut across both arms, an L, a cut through a vertex, a tangent touch, a cut
 * that misses, and a multi-ring feature.
 *
 * **A straight cut, not a freehand polyline.** A floor is divided by walls, and a wall is straight;
 * a polyline cut buys generality nobody asked for and brings self-intersection with it. Two clicks.
 *
 * **Holes are already gone before we get here.** `ringsOuter()` takes `coordinates[0]` only, so
 * every ring in `GEOM.rings` is a simple outer ring and each can be cut independently. If interior
 * rings ever reach the editor this needs revisiting — a hole straddling the cut belongs to both
 * halves and neither of them is a simple ring any more.
 *
 * Everything here is plane arithmetic in SCREEN pixels, like `geomRotate`/`geomScale`/
 * `geomStraighten` — the caller projects on the way in and unprojects on the way out. Doing it in
 * lng/lat would make "the same distance" mean two different things along the two axes.
 */
/* SPLIT-ENGINE-START — the harness extracts everything between these markers and runs it in node,
   so the code under test is literally the code that ships. Keep it free of `map` and of the DOM. */
function ringSignedArea(pts) {
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    s += p[0] * q[1] - q[0] * p[1];
  }
  return s / 2;
}

/** A ring with its closing point dropped — the arithmetic below wants each vertex exactly once. */
function ringOpen(ring) {
  const pts = ring.slice();
  while (pts.length > 1 &&
         pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1]) pts.pop();
  return pts;
}

/** …and back, closed the way every other ring in this file is. */
function ringClose(pts) {
  const out = pts.map(p => p.slice());
  out.push(out[0].slice());
  return out;
}

/**
 * Split ONE ring by the line through `a`→`b`.
 *
 * Returns `{ left, right }` of open point arrays; `null` when the line simply does not cut this
 * ring (the caller then keeps it whole); or `{ tangent: true }` when the line both cuts the ring
 * AND touches it somewhere without crossing — see the refusal note in step 2.
 */
function splitOneRing(ring, a, dx, dy, len) {
  const pts = ringOpen(ring);
  const n = pts.length;
  if (n < 3) return null;

  // Distance-from-the-line, scaled by `len` so the tolerance below reads in pixels.
  const cross = p => dx * (p[1] - a[1]) - dy * (p[0] - a[0]);
  const ON = 1e-6 * len;
  const sideOf = p => { const c = cross(p); return Math.abs(c) <= ON ? 0 : (c > 0 ? 1 : -1); };

  /* 1. Augment the ring: every strict crossing becomes a real vertex sitting on the line. A vertex
        that is already on the line needs no insertion — it is its own node. */
  const nodes = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    const sp = sideOf(p), sq = sideOf(q);
    nodes.push({ p: p.slice(), s: sp });
    if (sp !== 0 && sq !== 0 && sp !== sq) {
      const cp = cross(p), cq = cross(q);
      const t = cp / (cp - cq);
      nodes.push({ p: [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t], s: 0 });
    }
  }
  const nn = nodes.length;

  /* 2. Which on-line nodes are genuine CROSSINGS? A vertex that touches the line and goes back the
        way it came is not one, and counting it would pair the chords wrongly and shred the shape.
        Consecutive on-line nodes (an edge lying along the cut) are one run, judged as a whole by
        the sides either end of it. */
  const isCross = new Array(nn).fill(false);
  let touches = false;
  if (!nodes.some(nd => nd.s !== 0)) return null;      // the whole ring lies on the line
  for (let i = 0; i < nn; i++) {
    if (nodes[i].s !== 0) continue;
    if (nodes[(i - 1 + nn) % nn].s === 0) continue;    // not the first node of its run
    let last = i;
    while (nodes[(last + 1) % nn].s === 0) last = (last + 1) % nn;
    const before = nodes[(i - 1 + nn) % nn].s;
    const after = nodes[(last + 1) % nn].s;
    // The run's LAST node carries the crossing; the earlier ones stay ordinary boundary points.
    // They sit on the line, so whichever face they land in they add no area to it.
    if (before !== after) isCross[last] = true;
    else touches = true;
  }

  const crossIdx = [];
  for (let i = 0; i < nn; i++) if (isCross[i]) crossIdx.push(i);
  // A simple closed ring meets a straight line an even number of times. An odd count means the
  // tolerance has swallowed something; refusing beats returning a shape nobody can trust.
  if (crossIdx.length < 2 || crossIdx.length % 2) return null;
  /**
   * ⚠️ **A cut that also grazes the shape is refused, not guessed at.**
   *
   * Step 4 pairs crossings by assuming they alternate inside/outside along the line. A point where
   * the ring merely TOUCHES the line breaks that alternation without announcing itself: lay a cut
   * exactly along the inner edge of a U and the pairing joins the two arms straight through the
   * notch, producing a ring that touches itself — area-correct, and complete nonsense as a room.
   * Handling every tangency exactly is a lot of machinery for a case a user hits by accident,
   * about one pixel wide. Refusing costs them a nudge and can never mangle a floor plan.
   */
  if (touches) return { tangent: true };
  const K = crossIdx.length;

  /* 3. Arcs — the ring path from one crossing to the next. Each is used exactly once below. */
  const arcAt = new Map();
  crossIdx.forEach((idx, k) => arcAt.set(idx, k));
  const arcs = [];
  for (let k = 0; k < K; k++) {
    const start = crossIdx[k], end = crossIdx[(k + 1) % K];
    const run = [];
    let i = start;
    do { run.push(nodes[i].p); i = (i + 1) % nn; } while (i !== end);
    arcs.push(run);
  }

  /* 4. Chords — the stretches of the cut line that lie INSIDE the ring. Sorted along the line the
        crossings alternate in/out, so consecutive pairs are exactly the inside stretches. This is
        the step that makes concave shapes work: a U cut across both arms has four crossings and
        two chords, and pairing them any other way would join the wrong arms. */
  const along = i => (nodes[i].p[0] - a[0]) * dx + (nodes[i].p[1] - a[1]) * dy;
  const order = crossIdx.slice().sort((i, j) => along(i) - along(j));
  const mate = new Map();
  for (let k = 0; k + 1 < order.length; k += 2) {
    mate.set(order[k], order[k + 1]);
    mate.set(order[k + 1], order[k]);
  }

  /* 5. Trace the faces: follow an arc, hop its end across the chord, follow the arc that starts on
        the far side, and keep going until the arcs bring you home. */
  const used = new Array(K).fill(false);
  const faces = [];
  for (let k0 = 0; k0 < K; k0++) {
    if (used[k0]) continue;
    const face = [];
    let k = k0, guard = 0, ok = true;
    while (!used[k]) {
      used[k] = true;
      for (const p of arcs[k]) face.push(p);
      const end = crossIdx[(k + 1) % K];
      face.push(nodes[end].p);
      const m = mate.get(end);
      const next = m === undefined ? undefined : arcAt.get(m);
      if (next === undefined || ++guard > K) { ok = false; break; }
      k = next;
    }
    if (ok && face.length >= 3) faces.push(face);
  }

  /* 6. Which side did each face land on? Read it off the vertex furthest from the line — the ones
        sitting ON it say nothing, and every face has at least one that does not. */
  const left = [], right = [];
  for (const face of faces) {
    if (Math.abs(ringSignedArea(face)) < 1e-6) continue;   // a sliver on the line, not a piece
    let far = 0;
    for (const p of face) { const c = cross(p); if (Math.abs(c) > Math.abs(far)) far = c; }
    if (Math.abs(far) <= ON) continue;
    (far > 0 ? left : right).push(face);
  }
  if (!left.length || !right.length) return null;          // touched, not cut
  return { left, right };
}

/**
 * Split every ring of a feature by the line through `a`→`b`.
 *
 * Returns `{ ok: false, reason }` — `"miss"` if the cut does not separate the feature, `"tangent"`
 * if it does but also grazes it, and the fix for that is a nudge — or, on success:
 *
 *     { ok: true, left, right, leftFrom, rightFrom, wasCut }
 *
 * `left`/`right` are closed rings either side of the line. `leftFrom[i]` / `rightFrom[i]` say which
 * INPUT ring each came from, and `wasCut[j]` whether input ring `j` was actually cut — the caller
 * needs both to keep track of which pieces are new, and it cannot reconstruct them from two
 * flattened lists.
 *
 * Rings the line misses entirely are not lost: they travel whole to whichever side they are on,
 * which is what makes this correct for a feature that is already several pieces.
 */
function splitRingsByLine(rings, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
  if (!(len > 0)) return { ok: false, reason: "miss" };
  const left = [], right = [], leftFrom = [], rightFrom = [], wasCut = [];
  let anyCut = false;
  rings.forEach((ring, j) => {
    const r = splitOneRing(ring, a, dx, dy, len);
    if (r && r.tangent) { wasCut[j] = "tangent"; return; }
    if (r) {
      anyCut = true;
      wasCut[j] = true;
      for (const f of r.left) { left.push(ringClose(f)); leftFrom.push(j); }
      for (const f of r.right) { right.push(ringClose(f)); rightFrom.push(j); }
      return;
    }
    // Untouched — whole, to the side it is on. Judged on its furthest vertex for the same reason
    // as a face: a ring resting a corner on the line is still entirely on one side of it.
    wasCut[j] = false;
    let far = 0;
    for (const p of ringOpen(ring)) {
      const c = dx * (p[1] - a[1]) - dy * (p[0] - a[0]);
      if (Math.abs(c) > Math.abs(far)) far = c;
    }
    if (far > 0) { left.push(ringClose(ringOpen(ring))); leftFrom.push(j); }
    else { right.push(ringClose(ringOpen(ring))); rightFrom.push(j); }
  });
  if (wasCut.some(c => c === "tangent")) return { ok: false, reason: "tangent" };
  if (!anyCut || !left.length || !right.length) return { ok: false, reason: "miss" };
  return { ok: true, left, right, leftFrom, rightFrom, wasCut };
}
/* SPLIT-ENGINE-END */

/**
 * Apply a cut, in lng/lat, and leave the feature holding every piece it now consists of.
 *
 * ⚠️ **No piece inherits the feature's identity, because nothing here can decide which should.**
 * A split says "this is two rooms", and a room needs a name, a type and a row in the tree — but
 * `edits` is keyed by `fid` and every fid comes from Pointr Cloud, so there is no second identity
 * to hand out. An earlier version of this marked one side "part A" and dashed the other; that was
 * the editor quietly answering a product question by which side of the line got clicked first.
 * It now reports the piece COUNT and claims nothing about which is which. The question — does a
 * split create a second feature, or reshape one feature into two parts? — is in the hand-off.
 *
 * Every face out of a cut ring becomes a NEW piece. Not "left keeps its identity": cut a U across
 * both arms and the left side is two separate rooms, so side is not piece and never was.
 */
function geomApplyCut(a, b) {
  if (!GEOM) return false;
  const toScreen = c => { const p = map.project(c); return [p.x, p.y]; };
  const res = splitRingsByLine(GEOM.rings.map(r => r.map(toScreen)),
                               toScreen(a), toScreen(b));
  if (!res.ok) {
    post("geomerror", {
      fid: GEOM.fid,
      message: res.reason === "tangent"
        ? "that cut runs along an edge — move it a little and try again"
        : "that cut does not divide the shape in two",
    });
    return false;
  }
  geomPush();
  const rings = [], pieceOf = [];
  const take = (list, from) => list.forEach((r, i) => {
    const src = from[i];
    rings.push(r.map(([x, y]) => { const q = map.unproject([x, y]); return [q.lng, q.lat]; }));
    // A ring the cut missed carries on being the piece it already was.
    pieceOf.push(res.wasCut[src] ? GEOM.nextPiece++ : GEOM.pieceOf[src]);
  });
  take(res.left, res.leftFrom);
  take(res.right, res.rightFrom);
  GEOM.rings = rings;
  GEOM.pieceOf = pieceOf;
  geomClearSel();                    // the rings are wholly rebuilt; every old index is meaningless
  return true;
}

/**
 * The two clicks that lay a cut.
 *
 * `mouseup` + `isTap`, like every other selection on this map — see the note on the document
 * handler. A press that travelled was a pan, and panning while you line a cut up is exactly what
 * you want to be able to do.
 */
function geomCutClick(lngLat) {
  if (!GEOM || GEOM.mode !== "split") return;
  if (!GEOM.cutA) {
    GEOM.cutA = [lngLat.lng, lngLat.lat];
    GEOM.cutB = [lngLat.lng, lngLat.lat];
    // Gathered once per cut, for the same reason the snap index is: the map holds still between
    // the two clicks, so these screen positions stay true for as long as they are needed.
    const own = GEOM.rings.map(r => r.map(c => { const p = map.project(c); return [p.x, p.y]; }));
    GEOM.cutRefs = geomGuideRefs(geomSnapIndex(), own.map(r => r.slice(0, -1)));
    /**
     * A cut is guided against **the walls it is cutting through**, so it can be laid square to the
     * room rather than square to the screen. Every distinct edge bearing of the shape, plus its
     * dominant grid — a wall you are cutting perpendicular to is usually one you can see.
     */
    const seenB = new Set();
    GEOM.cutBases = [];
    for (const r of own) {
      for (let i = 0; i + 1 < r.length; i++) {
        const b = geomBearing(r[i], r[i + 1]);
        if (b === null) continue;
        const k = Math.round(b * 2) / 2;              // half a degree is as fine as this needs
        if (!seenB.has(k)) { seenB.add(k); GEOM.cutBases.push(b); }
      }
    }
    GEOM.cutBases.push(dominantAngle(own) * 180 / Math.PI);
    geomDraw(); post("geomstate", geomState());
    return;
  }
  const a = GEOM.cutA, b = [lngLat.lng, lngLat.lat];
  GEOM.cutA = GEOM.cutB = null;
  GEOM.cutRefs = null;
  GEOM.cutBases = null;
  GEOM.guides = GEOM.guideAt = null;
  // A refused cut stays in split mode, because the message it just posted says "try again" — being
  // dropped back into Points would contradict it. A cut that landed goes to Points, where the new
  // outlines can be tidied up.
  if (geomApplyCut(a, b)) GEOM.mode = "vertices";
  geomDraw(); post("geomstate", geomState());
}

/** Abandon a half-laid cut, leaving split mode armed for another go. */
function geomCancelCut() {
  if (!GEOM || !GEOM.cutA) return false;
  GEOM.cutA = GEOM.cutB = null;
  GEOM.cutRefs = null;
  GEOM.cutBases = null;
  GEOM.guides = GEOM.guideAt = null;
  geomDraw(); post("geomstate", geomState());
  return true;
}

/* ── drawing and interaction ───────────────────────────────────────────────────────────────── */

function geomLayer() {
  let l = document.getElementById("geom");
  if (!l) {
    l = el("svg", { id: "geom" });
    l.setAttribute("style",
      "position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none");
    document.body.appendChild(l);
  }
  return l;
}

function geomDraw() {
  const l = geomLayer();
  while (l.firstChild) l.removeChild(l.firstChild);
  if (!GEOM || !map) return;

  /**
   * A point feature: one handle, and that is the whole of it. Drawn larger than a vertex handle
   * because it IS the feature rather than a corner of one, and there is nothing else to aim at.
   */
  if (GEOM.kind === "point") {
    if (!GEOM.point) return;
    const p = map.project(GEOM.point);
    l.appendChild(el("circle", { cx: p.x, cy: p.y, r: 13, fill: "#0b369c", "fill-opacity": .12 }));
    const h = el("circle", { cx: p.x, cy: p.y, r: HANDLE_R + 2, fill: "#fff",
                             stroke: "#0b369c", "stroke-width": 2.5, class: "geom-pt" });
    h.setAttribute("style", "pointer-events:auto;cursor:grab");
    h.addEventListener("mousedown", ev => { ev.stopPropagation(); geomDown(ev, { kind: "point" }); });
    l.appendChild(h);
    return;
  }

  for (const [ri, ring] of GEOM.rings.entries()) {
    const d = ring.map((c, i) => { const p = map.project(c); return (i ? "L" : "M") + p.x + " " + p.y; }).join(" ") + " Z";
    /**
     * Every piece is drawn the same. After a split they are all equally the feature — none of them
     * is the "real" one and none is the leftover, because nothing here has decided which keeps the
     * name. The cut shows as the seam between two outlines, which is the whole of what happened;
     * the toolbar says how many pieces there now are.
     */
    const face = el("path", { d, fill: "#0b369c", "fill-opacity": .10, stroke: "#0b369c",
                              "stroke-width": 2, class: "geom-face" });
    if (GEOM.mode === "transform") face.setAttribute("style", "pointer-events:auto;cursor:move");
    face.addEventListener("mousedown", ev => geomDown(ev, { kind: "move" }));
    l.appendChild(face);

    if (GEOM.mode === "vertices") {
      /**
       * Midpoints first, so a vertex always wins the click where the two overlap.
       *
       * ⚠️ Over `slice(0, -1)`, not the whole ring. The closing point repeats the first, so the
       * full loop produced a midpoint between `p0` and `p0` — a zero-length "edge" sitting exactly
       * under the first handle, whose click inserted a vertex AFTER the closing point and tore the
       * ring open. Its neighbour is `ring[ci + 1]`, which for the last real vertex is the closing
       * point, i.e. the first — exactly the edge that wraps.
       */
      ring.slice(0, -1).forEach((c, ci) => {
        const n = ring[ci + 1];
        const a = map.project(c), b = map.project(n);
        const m = el("circle", { cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, r: 3.5,
                                 fill: "#fff", stroke: "#0b369c", "stroke-width": 1.5, class: "geom-mid" });
        m.setAttribute("style", "pointer-events:auto;cursor:copy");
        m.addEventListener("mousedown", ev => { ev.stopPropagation(); geomAddVertex(ri, ci); });
        l.appendChild(m);
      });
      // The closing point is the first one again — drawing a handle on it would put two handles on
      // top of each other, and dragging the wrong one would tear the ring open.
      ring.slice(0, -1).forEach((c, ci) => {
        const p = map.project(c);
        const on = GEOM.sel.has(selKey(ri, ci));
        // A selected corner is FILLED. Hollow-vs-hollow-with-a-thicker-ring is not a difference you
        // can see across twenty handles at a glance, and the whole point of a marquee is the glance.
        const h = el("circle", { cx: p.x, cy: p.y, r: on ? HANDLE_R + 1 : HANDLE_R,
                                 fill: on ? "#0b369c" : "#fff",
                                 stroke: "#0b369c", "stroke-width": 2, class: "geom-vx" });
        h.setAttribute("style", "pointer-events:auto;cursor:grab");
        h.addEventListener("mousedown", ev => {
          ev.stopPropagation();
          // alt-click removes, which is the convention every editor already taught people
          if (ev.altKey) return geomRemoveVertex(ri, ci);
          const key = selKey(ri, ci);
          if (ev.shiftKey) {                       // shift-click toggles, and never starts a drag
            if (GEOM.sel.has(key)) GEOM.sel.delete(key); else GEOM.sel.add(key);
            geomDraw(); post("geomstate", geomState());
            return;
          }
          // Dragging an unselected corner is a fresh single selection; dragging one that is
          // already selected takes the whole set with it.
          if (!GEOM.sel.has(key)) { GEOM.sel.clear(); GEOM.sel.add(key); geomDraw(); }
          geomDown(ev, { kind: "vertex", ri, ci });
        });
        l.appendChild(h);
      });
    }
  }

  /**
   * The transform box — Transform mode only, where the subject is the whole shape.
   *
   * Four corners scale about the box's centre and a knob on a stem rotates. Not shown in Reshape,
   * where the corners of the *outline* are the subject and a second set of squares nearby would be
   * a coin toss every time you reached for one.
   */
  if (GEOM.mode === "transform") {
    const box = geomBox();
    if (box) {
      const x0 = box.minX - BOX_PAD, y0 = box.minY - BOX_PAD;
      const x1 = box.maxX + BOX_PAD, y1 = box.maxY + BOX_PAD;
      l.appendChild(el("rect", { x: x0, y: y0, width: x1 - x0, height: y1 - y0,
                                 fill: "none", stroke: "#0b369c", "stroke-width": 1,
                                 "stroke-dasharray": "5 4", "stroke-opacity": .7 }));
      // the rotate knob, on a stem above the top edge
      const kx = (x0 + x1) / 2, ky = y0 - BOX_STEM;
      l.appendChild(el("line", { x1: kx, y1: y0, x2: kx, y2: ky,
                                 stroke: "#0b369c", "stroke-width": 1, "stroke-opacity": .7 }));
      const knob = el("circle", { cx: kx, cy: ky, r: 7, fill: "#fff",
                                  stroke: "#0b369c", "stroke-width": 2, class: "geom-rot" });
      knob.setAttribute("style", "pointer-events:auto;cursor:grab");
      knob.addEventListener("mousedown", e => { e.stopPropagation(); geomDown(e, { kind: "rotate" }); });
      l.appendChild(knob);

      // the four scale corners — square, so they are never mistaken for a vertex handle
      const S = 9;
      [[x0, y0, "nwse"], [x1, y0, "nesw"], [x1, y1, "nwse"], [x0, y1, "nesw"]]
        .forEach(([hx, hy, dir]) => {
          const h = el("rect", { x: hx - S / 2, y: hy - S / 2, width: S, height: S, rx: 2,
                                 fill: "#fff", stroke: "#0b369c", "stroke-width": 2,
                                 class: "geom-scale" });
          h.setAttribute("style", "pointer-events:auto;cursor:" + dir + "-resize");
          h.addEventListener("mousedown", e => { e.stopPropagation(); geomDown(e, { kind: "scale" }); });
          l.appendChild(h);
        });

      /**
       * The live readout, beside the pointer rather than pinned to the box — your eye is on the
       * handle you are dragging, and a number in the corner of the shape is a number you have to go
       * and find. It says when the modifier is holding it, because "37°" and "35° because I am
       * holding Shift" are different facts.
       */
      if (GEOM.xform) {
        const tx = GEOM.xform.x + 16, ty = GEOM.xform.y - 12;
        const label = GEOM.xform.text + (GEOM.xform.snapped ? "  snap" : "");
        const w = label.length * 7.1 + 14;
        l.appendChild(el("rect", { x: tx, y: ty - 12, width: w, height: 21, rx: 5,
                                   fill: "#0b369c" }));
        const t = el("text", { x: tx + 7, y: ty + 3, fill: "#fff",
                               "font-family": "system-ui, sans-serif", "font-size": 12 });
        t.textContent = label;
        l.appendChild(t);
      }
    }
  }

  /**
   * The guides in force. Drawn in the snap green rather than the edit blue, because they belong to
   * the same family of "the tool is holding you to something" as the snap marks — and the blue is
   * already spoken for by the shape itself.
   */
  if (GEOM.guides && GEOM.guides.length) {
    const far = (window.innerWidth + window.innerHeight) * 2;
    for (const g of GEOM.guides) {
      if (g.kind === "angle") {
        const a = g.deg * Math.PI / 180;
        const ux = Math.cos(a) * far, uy = Math.sin(a) * far;
        l.appendChild(el("line", { x1: g.from[0] - ux, y1: g.from[1] - uy,
                                   x2: g.from[0] + ux, y2: g.from[1] + uy,
                                   stroke: "#00875a", "stroke-width": 1,
                                   "stroke-dasharray": "6 5", "stroke-opacity": .8 }));
        /**
         * The angle **to the wall it is measured from**, not to the screen — so `0°` reads "carries
         * straight on from that wall" and `90°` reads "square to it". An absolute bearing would be
         * a number about the monitor.
         */
        const label = Math.round((g.rel ?? g.deg) % 180) + "°";
        /**
         * A right angle gets the draughtsman's square mark, drawn **at the corner it belongs to**
         * (Olcay, 2026-08-16: *"snapping and highlighting to the next node's 90 degree"*). 90° is
         * the one people are actually reaching for, and a number in a box is a weaker signal than
         * the symbol every floor plan already uses for it. Set in the corner between the wall it is
         * measured from and the guide ray, so it says which two lines are square.
         */
        if (Math.abs(((g.rel ?? 0) % 180) - 90) < 1e-6) {
          const R = 13;
          const a1 = g.deg * Math.PI / 180;
          const a2 = (g.deg - (g.rel > 180 ? -90 : 90)) * Math.PI / 180;
          const p1 = [g.from[0] + Math.cos(a1) * R, g.from[1] + Math.sin(a1) * R];
          const p2 = [g.from[0] + Math.cos(a2) * R, g.from[1] + Math.sin(a2) * R];
          l.appendChild(el("path", {
            d: `M${p1[0]} ${p1[1]} L${p1[0] + p2[0] - g.from[0]} ${p1[1] + p2[1] - g.from[1]} L${p2[0]} ${p2[1]}`,
            fill: "none", stroke: "#00875a", "stroke-width": 2,
          }));
        }
        l.appendChild(el("rect", { x: g.from[0] + 10, y: g.from[1] - 22, width: label.length * 7.5 + 12,
                                   height: 19, rx: 5, fill: "#00875a" }));
        const t = el("text", { x: g.from[0] + 16, y: g.from[1] - 8, fill: "#fff",
                               "font-family": "system-ui, sans-serif", "font-size": 11.5 });
        t.textContent = label;
        l.appendChild(t);
      } else {
        /**
         * The stretch between the corner being tracked and where the point actually went — the bit
         * that says WHICH corner you agree with, rather than merely that something somewhere lines
         * up.
         *
         * ⚠️ It used to reach for `GEOM.snapHit`, which is **always null here**: guides only run
         * when snapping caught nothing. Every ternary fell through to the reference's own
         * coordinates, so the line was drawn from the corner to itself — zero-length, invisible,
         * and silently doing nothing since the day it was written. It reads the resolved point now.
         */
        const to = GEOM.guideAt;
        if (to) {
          l.appendChild(el("line", { x1: g.ref[0], y1: g.ref[1], x2: to[0], y2: to[1],
                                     stroke: "#00875a", "stroke-width": 1.5,
                                     "stroke-dasharray": "3 4", "stroke-opacity": .95 }));
        }
        l.appendChild(el("line", {
          x1: g.axis === "x" ? g.ref[0] : g.ref[0] - far,
          y1: g.axis === "x" ? g.ref[1] - far : g.ref[1],
          x2: g.axis === "x" ? g.ref[0] : g.ref[0] + far,
          y2: g.axis === "x" ? g.ref[1] + far : g.ref[1],
          stroke: "#00875a", "stroke-width": 1, "stroke-dasharray": "3 4", "stroke-opacity": .55 }));
        l.appendChild(el("rect", { x: g.ref[0] - 3.5, y: g.ref[1] - 3.5, width: 7, height: 7,
                                   fill: "#00875a" }));
      }
    }
  }

  /**
   * What snapping has caught, right now.
   *
   * Without this a snap is indistinguishable from a slightly inaccurate drag — the shape lands
   * somewhere you did not put it and you have no way to know whether that was the tool helping or
   * the tool misbehaving. The mark differs by kind because the two are different promises: a
   * **corner** is exact and gets a ring, an **edge** only fixes you across the wall and gets a
   * short bar lying along it.
   */
  if (GEOM.snapHit) {
    const h = GEOM.snapHit;
    if (h.kind === "corner") {
      l.appendChild(el("circle", { cx: h.x, cy: h.y, r: 8, fill: "none",
                                   stroke: "#00875a", "stroke-width": 2 }));
      l.appendChild(el("circle", { cx: h.x, cy: h.y, r: 2.5, fill: "#00875a" }));
    } else {
      l.appendChild(el("rect", { x: h.x - 9, y: h.y - 9, width: 18, height: 18,
                                 fill: "none", stroke: "#00875a", "stroke-width": 2,
                                 transform: "rotate(45 " + h.x + " " + h.y + ")" }));
    }
  }

  // The marquee, while it is being dragged.
  if (GEOM.band) {
    const a = map.project(GEOM.band.a), b = map.project(GEOM.band.b);
    l.appendChild(el("rect", {
      x: Math.min(a.x, b.x), y: Math.min(a.y, b.y),
      width: Math.abs(b.x - a.x), height: Math.abs(b.y - a.y),
      fill: "#0b369c", "fill-opacity": .08,
      stroke: "#0b369c", "stroke-width": 1, "stroke-dasharray": "4 3",
    }));
  }

  /**
   * The cut being laid. Drawn EXTENDED to the edge of the viewport, because that is what the
   * operation actually does — the two clicks pick a line, not a segment, and a stubby preview
   * between two points would promise a cut that stops where you stopped clicking.
   */
  if (GEOM.mode === "split" && GEOM.cutA && GEOM.cutB) {
    const a = map.project(GEOM.cutA), b = map.project(GEOM.cutB);
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    if (len > 0.5) {
      const far = (window.innerWidth + window.innerHeight) * 2;
      const ux = (dx / len) * far, uy = (dy / len) * far;
      l.appendChild(el("line", { x1: a.x - ux, y1: a.y - uy, x2: a.x + ux, y2: a.y + uy,
                                 stroke: "#0b369c", "stroke-width": 1, "stroke-dasharray": "4 4",
                                 "stroke-opacity": .45 }));
    }
    l.appendChild(el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y,
                               stroke: "#0b369c", "stroke-width": 2 }));
    l.appendChild(el("circle", { cx: a.x, cy: a.y, r: 4, fill: "#0b369c" }));
  }
}

function geomAddVertex(ri, ci) {
  geomPush();
  geomClearSel();                              // the insert reindexes everything after it
  const ring = GEOM.rings[ri];
  const a = ring[ci], b = ring[(ci + 1) % ring.length];
  ring.splice(ci + 1, 0, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
  geomDraw(); post("geomstate", geomState());
}

function geomRemoveVertex(ri, ci) {
  if (GEOM.rings[ri].length <= 4) return;      // a ring needs three distinct points, plus closure
  geomPush();
  GEOM.rings[ri].splice(ci, 1);
  geomClearSel();                              // indices below this one have all shifted
  geomDraw(); post("geomstate", geomState());
}

/**
 * Drag, on `mousemove` at the document level rather than on the handle.
 *
 * The handle is re-created by `geomDraw()` on every frame, so a listener bound to it would be
 * destroyed mid-gesture — the same reason selection here hangs off `mouseup` and not `click`.
 */
function geomDown(ev, what) {
  if (!GEOM) return;
  ev.preventDefault();
  const start = { x: ev.clientX, y: ev.clientY };
  const snapshot = geomSnap();
  /**
   * ⚠️ **The geometry as it was when the gesture began — every frame is computed from THIS.**
   *
   * The whole-shape drag used to apply a per-frame delta on top of the previous frame's result,
   * which meant a `project → add pixels → unproject` round trip *per frame*. Mercator is not
   * linear, and that round trip is lossy, so a slow drag across the map accumulated error a fast
   * one did not — the shape ended up somewhere slightly different depending on how you moved the
   * mouse, which is indefensible for a floor plan. Rebuilding from the origin each frame makes
   * every gesture absolute: the same pointer position always produces the same geometry.
   *
   * It is also what makes rotate and scale honest. Applying 1° thirty times is not a 30° turn.
   */
  const origRings = JSON.parse(JSON.stringify(GEOM.rings));
  const origPoint = GEOM.point ? GEOM.point.slice() : null;
  /**
   * Built once, here, for the life of the gesture — the map cannot move while a shape is being
   * dragged, so these screen coordinates stay true, and rebuilding per frame would cost more than
   * the frame has. Null when Snap is off, which turns every query below into a no-op.
   */
  const snapIdx = geomSnapIndex();
  /** The dragged feature's own corners at gesture start, in screen space — what move-snap tests. */
  const origScreen = origRings.map(r => r.slice(0, -1).map(c => {
    const p = map.project(c);
    return [p.x, p.y];
  }));
  const origPointScreen = origPoint ? (() => { const p = map.project(origPoint); return [p.x, p.y]; })() : null;
  const snapAt = (x, y) => snapQuery(snapIdx, x, y, SNAP_PX);
  /**
   * What tracking guides may line up with: every OTHER feature's corner near the drag, plus this
   * feature's own corners. Its own matter as much as its neighbours' — squaring a room against
   * itself is the commonest alignment there is.
   */
  const guideRefs = geomGuideRefs(snapIdx, origScreen);
  /** This shape's own grid, as Straighten measures it — the last-resort reference bearing. */
  const gridDeg = origScreen.length
    ? dominantAngle(origScreen.map(r => r.concat([r[0]]))) * 180 / Math.PI
    : 0;
  /** The transform pivot, fixed at gesture start — the box moves as you drag, the pivot must not. */
  const box = geomBox();
  const cx = box ? box.cx : 0, cy = box ? box.cy : 0;
  const a0 = Math.atan2(start.y - cy, start.x - cx);
  const d0 = Math.hypot(start.x - cx, start.y - cy) || 1;
  let moved = false;

  /** Rebuild the whole feature from its gesture-start state through one screen-space function. */
  const fromOrigin = fn => {
    GEOM.rings = origRings.map(r => r.map(fn));
    if (origPoint) GEOM.point = fn(origPoint);
  };
  const shift = (dx, dy) => fromOrigin(c => {
    const p = map.project(c);
    const q = map.unproject([p.x + dx, p.y + dy]);
    return [q.lng, q.lat];
  });

  const move = e => {
    if (!GEOM) return;
    if (!moved) { moved = true; GEOM.history.push(snapshot); GEOM.future = []; }
    const pt = { x: e.clientX, y: e.clientY };

    if (what.kind === "point") {
      const hit = snapAt(pt.x, pt.y);
      GEOM.snapHit = hit;
      /**
       * A point has no neighbours, so there is no edge to take an angle from — but it can still be
       * lined up with the corners around it, which is most of what placing a POI *is*. Alignment
       * guides only; `resolveGuides` handles a null anchor by simply not offering an angle.
       */
      let px = pt.x, py = pt.y;
      if (!hit && GEOM.snap) {
        const g = resolveGuides(null, pt.x, pt.y, guideRefs, geomSnapping(e));
        px = g.x; py = g.y;
        GEOM.guides = g.guides;
        GEOM.guideAt = [g.x, g.y];
      } else {
        GEOM.guides = GEOM.guideAt = null;
      }
      const q = map.unproject(hit ? [hit.x, hit.y] : [px, py]);
      GEOM.point = [q.lng, q.lat];

    } else if (what.kind === "vertex") {
      const hit = snapAt(pt.x, pt.y);
      GEOM.snapHit = hit;
      /**
       * Guides only when snapping caught nothing. A snap is a point that actually exists on another
       * feature; a guide is a line you might want to be on. Letting a guide override a snap would
       * pull you off the very corner you had just met.
       *
       * The anchor is the corner BEFORE this one in the ring, so the angle guide measures the edge
       * you are dragging — which is the edge you want straight.
       */
      let gx = pt.x, gy = pt.y;
      /**
       * ⚠️ **Guides obey the Snap toggle**, so the toggle means one thing — *the tool holds you to
       * something* — and turning it off is the way to place a corner at a deliberate 85°, which a
       * 6° magnet on 90° would otherwise make unreachable. Without an escape, a helpful magnet is
       * just a tool overruling you.
       */
      if (!hit && GEOM.snap) {
        const ring = origScreen[what.ri] || [];
        const g = resolveGuides(geomVertexAnchors(ring, what.ci, gridDeg),
                                pt.x, pt.y, guideRefs, geomSnapping(e));
        gx = g.x; gy = g.y;
        GEOM.guides = g.guides;
        GEOM.guideAt = [g.x, g.y];
      } else {
        GEOM.guides = GEOM.guideAt = null;
      }
      const q = map.unproject(hit ? [hit.x, hit.y] : [gx, gy]);
      /**
       * **The dragged corner goes where the pointer is; the rest of the selection follows by the
       * same screen offset.** Not "every selected corner to the pointer", which would collapse
       * them all onto one spot — the selection keeps its shape and simply moves.
       *
       * Snapping still applies to the corner under the cursor only. Snapping each of them to its
       * own nearest neighbour would distort the group into whatever happened to be nearby.
       */
      const p0 = map.project(origRings[what.ri][what.ci]);
      const p1 = map.project([q.lng, q.lat]);
      const dx = p1.x - p0.x, dy = p1.y - p0.y;
      GEOM.rings = JSON.parse(JSON.stringify(origRings));
      GEOM.rings[what.ri][what.ci] = [q.lng, q.lat];
      for (const k of GEOM.sel) {
        if (k === selKey(what.ri, what.ci)) continue;
        const [ri, ci] = k.split(":").map(Number);
        const ring = GEOM.rings[ri];
        if (!ring || ci >= ring.length - 1) continue;
        const p = map.project(origRings[ri][ci]);
        const to = map.unproject([p.x + dx, p.y + dy]);
        ring[ci] = [to.lng, to.lat];
      }
      // Every ring closes on its own first point, so a moved first corner moves the closer too.
      for (const ri of new Set([...GEOM.sel].map(k => Number(k.split(":")[0])).concat(what.ri))) {
        const ring = GEOM.rings[ri];
        if (ring) ring[ring.length - 1] = ring[0].slice();
      }

    } else if (what.kind === "rotate") {
      let deg = geomWrapDeg((Math.atan2(pt.y - cy, pt.x - cx) - a0) * 180 / Math.PI);
      if (geomSnapping(e)) deg = Math.round(deg / SNAP_DEG) * SNAP_DEG;
      const a = deg * Math.PI / 180, cos = Math.cos(a), sin = Math.sin(a);
      fromOrigin(c => {
        const p = map.project(c), dx = p.x - cx, dy = p.y - cy;
        const q = map.unproject([cx + dx * cos - dy * sin, cy + dx * sin + dy * cos]);
        return [q.lng, q.lat];
      });
      GEOM.xform = { text: (deg > 0 ? "+" : "") + Math.round(deg) + "°",
                     snapped: geomSnapping(e), x: pt.x, y: pt.y };

    } else if (what.kind === "scale") {
      let k = Math.hypot(pt.x - cx, pt.y - cy) / d0;
      if (geomSnapping(e)) k = Math.round(k / SNAP_PCT) * SNAP_PCT;
      // A shape dragged through its own centre must not invert or vanish.
      k = Math.max(0.05, Math.min(20, k));
      fromOrigin(c => {
        const p = map.project(c);
        const q = map.unproject([cx + (p.x - cx) * k, cy + (p.y - cy) * k]);
        return [q.lng, q.lat];
      });
      GEOM.xform = { text: Math.round(k * 100) + "%",
                     snapped: geomSnapping(e), x: pt.x, y: pt.y };

    } else {
      let dx = pt.x - start.x, dy = pt.y - start.y;
      /**
       * ⚠️ **Moving the whole shape used to ignore Snap entirely** (Olcay, 2026-08-16: *"While move
       * is selected snap should snap to other features again"*) — the toggle was on, the tool said
       * it was snapping, and nothing snapped.
       *
       * Every one of the feature's own corners is offered to the index at its would-be position,
       * and the single closest catch wins: the whole shape is nudged by that one correction, so it
       * arrives against its neighbour without being deformed. Testing them all is what makes it
       * feel right — whichever corner comes near a wall is the one that takes hold, which is what
       * you were aiming with.
       */
      let best = null;
      for (const ring of origScreen) {
        for (const p of ring) {
          const hit = snapAt(p[0] + dx, p[1] + dy);
          if (hit && (!best || hit.d < best.d)) {
            best = { d: hit.d, ddx: hit.x - (p[0] + dx), ddy: hit.y - (p[1] + dy), at: hit };
          }
        }
      }
      if (!best && origPointScreen) {
        const hit = snapAt(origPointScreen[0] + dx, origPointScreen[1] + dy);
        if (hit) best = { d: hit.d, ddx: hit.x - (origPointScreen[0] + dx),
                          ddy: hit.y - (origPointScreen[1] + dy), at: hit };
      }
      if (best) { dx += best.ddx; dy += best.ddy; }
      GEOM.snapHit = best ? best.at : null;
      shift(dx, dy);
    }
    geomDraw();
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    if (GEOM) { GEOM.xform = null; GEOM.snapHit = null; GEOM.guides = GEOM.guideAt = null; }
    if (moved) { geomDraw(); post("geomstate", geomState()); }
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
}

window.addEventListener("message", (ev) => {
  const d = ev.data;
  if (!d) return;
  if (d.type === "changes" && Array.isArray(d.changes)) {
    // The app owns the diff, so its list is authoritative: drop anything it no longer sends (an
    // empty list = a plain map, e.g. Map Content / Editing Level), then merge by feature name so
    // geometry we've already resolved survives a decision change.
    const keep = CHANGES.filter(c => d.changes.some(i => i.name === c.name));
    CHANGES.length = 0;
    d.changes.forEach(incoming => {
      const ch = keep.find(c => c.name === incoming.name);
      CHANGES.push(ch ? Object.assign(ch, incoming) : Object.assign({}, incoming));
    });
    RESOLVED = RESOLVED.filter(r => CHANGES.indexOf(r.change) >= 0);
    resolvePasses = 0;
    SELECTED = CHANGES.indexOf(SELECTED) >= 0 ? SELECTED : null;
    HOVERED = null;
    if (map) { resolveChanges(); redraw(); renderTip(); }
  } else if (d.type === "highlight") {
    highlightFeatures(d.sel || null);
  } else if (d.type === "focusfeature") {
    // Two jobs, two retry budgets — see sendFeatureProps.
    focusFeature(d.fid, 0, d.padRight);
    sendFeatureProps(d.fid);
  } else if (d.type === "active") {
    // A changelog row was clicked — mirror it here. Deferred until geometry exists, because a
    // row can be clicked before `resolveChanges()` has caught up and there'd be nothing to fly to.
    PENDING_ACTIVE = d.id ?? null;
    if (map) setActive(PENDING_ACTIVE);
  } else if (d.type === "target") {
    // Switch the level (and building) under the map without reloading the SDK. All of the care —
    // idempotence, coalescing, the readiness gate — lives in requestTarget().
    requestTarget({ building: d.building, level: d.level });
  } else if (d.type === "camera" && d.cam && map) {
    // A mirrored move from the other Compare pane. Guarded so it can't echo back.
    applyingCam = true;
    try {
      map.jumpTo({ center: [d.cam.lng, d.cam.lat], zoom: d.cam.zoom, bearing: d.cam.bearing, pitch: d.cam.pitch });
    } finally { applyingCam = false; }
  } else if (d.type === "prefs") {
    if ("greyscale" in d) prefs.greyscale = !!d.greyscale;
    if ("hidePoiLabels" in d) prefs.hidePoiLabels = !!d.hidePoiLabels;
    if ("floorplan" in d) prefs.floorplan = !!d.floorplan;
    if ("basemap" in d) prefs.basemap = d.basemap;
    applyPrefs();
  } else if (d.type === "dropzone") {
    // The app says whether this pane accepts file drops (upload surfaces only — a Compare pane
    // or a review map shouldn't invite an upload it can't take).
    DROP_ON = !!d.on;
  } else if (d.type === "peers") {
    PEERS = Array.isArray(d.peers) ? d.peers : [];
    drawPeers();
  } else if (d.type === "geom") {
    // One entry point for every toolbar command — the app never reaches into the editor's state.
    if (d.cmd === "begin") geomBegin(d.fid);
    else if (d.cmd === "end") geomEnd(!!d.commit);
    else if (d.cmd === "commit") geomCommit();
    else if (d.cmd === "mode") geomSetMode(d.mode);
    else if (d.cmd === "snap") geomToggleSnap();
    else if (d.cmd === "undo") geomUndo();
    else if (d.cmd === "redo") geomRedo();
    else if (d.cmd === "reset") geomReset();
    else if (d.cmd === "simplify") geomSimplify();
    else if (d.cmd === "square") geomSquare();
    // `rotate` / `scale` used to arrive here from four stepped toolbar buttons. They are handles on
    // the transform box now (see geomBox), so there is nothing left for the app to command.
    // Split is a MODE, not an act: the toolbar arms it, the two clicks on the map do the cutting.
    else if (d.cmd === "split") geomSetMode(GEOM && GEOM.mode === "split" ? "vertices" : "split");
  } else if (d.type === "editing") {
    EDITING = Array.isArray(d.editing) ? d.editing : [];
    drawEditing();
  } else if (d.type === "editabletypes") {
    BLOCKED_TYPES = new Set(d.types || []);
  } else if (d.type === "decidable") {
    CAN_DECIDE = !!d.on;
    renderTip();          // a card already open must lose its control immediately
  }
});

/* ── drag-and-drop floor-plan upload ─────────────────────────────────────────
   The iframe owns every drag event over the map, so the drop is caught HERE and only the file's
   name/size is posted up — the app decides what it means (confirmation overlay with the
   building/level the map is showing). preventDefault runs regardless of DROP_ON so a stray drop
   never makes the browser navigate away from the map page. The veil is visual only
   (pointer-events: none); depth-counting dragenter/leave is the classic fix for leave events
   firing on every child boundary. */
let DROP_ON = false, dragDepth = 0;
/**
 * May the user DECIDE from this map? (Olcay, 2026-08-14: *"the overlay that we can reject
 * flag or confirm ... only lives in review. Once flagged the flag icon should continue
 * showing on the map."*)
 *
 * The mark and the control are two different things. A flag is a **fact about the feature**
 * and travels with it everywhere; ✓ 🚩 ✗ is an **act of reviewing** and belongs only where a
 * review is happening. Browsing Map Content you see the flag and cannot change it.
 *
 * Told, not inferred, and defaulting to true — a pane that forgets to say stays as it was.
 * The parent sets it from whether it passed an `onDecision` handler at all, so the map can
 * never offer a control whose result nobody is listening for.
 */
let CAN_DECIDE = true;

/**
 * Other people's cursors, in MAP coordinates (Olcay, 2026-08-14).
 *
 * The app decides who belongs here — it knows the floor everyone is on, and presence is scoped to
 * the level, never the viewport. This page's only job is to project lng/lat into its own screen
 * and draw a pointer, which is why the position travels as coordinates: everyone is at a different
 * zoom and window size, and a pixel means nothing outside the viewport that produced it.
 */
let PEERS = [];
/** Features other people have open in the editor: [{ fid, who, colour }]. */
let EDITING = [];

/**
 * The `mainType`s the panel will NOT edit — posted by the app, which owns the taxonomy (this page
 * has none). `null` means "not told yet", and nothing is editable until it arrives: guessing would
 * light up walls.
 *
 * A NEGATIVE set, because that is the closed one. `MAIN_CLASS` defaults anything it does not list
 * to `poi`, so the editable side is open-ended; the floor-plan side is short and finite.
 */
let BLOCKED_TYPES = null;

/**
 * The feature under the cursor that is NOT part of a review — Olcay, 2026-08-14: *"when hovered we
 * should show the same overlay for each feature"*. A change already has its own card (with the
 * decision control where that is allowed); this is the same card for everything else, so hovering
 * the map answers "what is this?" everywhere rather than only over the diff.
 */
let HOVER_FEATURE = null;
const veil = document.getElementById("dropveil");
const hasFiles = ev => !!(ev.dataTransfer && Array.from(ev.dataTransfer.types || []).indexOf("Files") >= 0);
document.addEventListener("dragenter", ev => {
  if (!hasFiles(ev)) return;
  ev.preventDefault();
  dragDepth++;
  if (DROP_ON) veil.classList.add("on");
});
document.addEventListener("dragover", ev => { if (hasFiles(ev)) ev.preventDefault(); });
document.addEventListener("dragleave", ev => {
  if (!hasFiles(ev)) return;
  if (--dragDepth <= 0) { dragDepth = 0; veil.classList.remove("on"); }
});
document.addEventListener("drop", ev => {
  ev.preventDefault();
  dragDepth = 0;
  veil.classList.remove("on");
  const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
  if (DROP_ON && f) post("filedrop", { name: f.name, size: f.size });
});
</script>
</body>
</html>
