function sendFeatureProps(fid, tries) {
  tries = tries || 0;
  if (!map || fid == null) return;
  const hit = scanFeature(fid);
  if (hit && hit.props) { post("featureprops", { fid, props: hit.props }); return; }
  if (tries < 20) setTimeout(() => sendFeatureProps(fid, tries + 1), 500);
}

function focusFeature(fid, tries, padRight) {
  tries = tries || 0;
  padRight = padRight || 0;
  if (!map || fid == null) return;
  const hit = scanFeature(fid);
  /**
   * Loaded tiles first, then the cache recorded when the tree's rows were built.
   *
   * The fallback is what makes a far-away feature reachable at all: without it the camera could
   * only ever fly to somewhere it had already been. With it, the move happens immediately, the
   * tiles arrive because of the move, and `sendFeatureProps` picks the properties up on a retry.
   */
  const bounds = (hit && hit.bounds) || FEATURE_BOUNDS[fid] || null;
  if (!bounds) {
    /**
     * Neither loaded nor cached — the normal case straight after a LEVEL SWITCH, when the tree has
     * asked for the floor and the feature in one breath and the counts haven't run yet. Retry
     * rather than silently doing nothing, which is what made clicking a row on another floor look
     * broken.
     *
     * ⚠️ The window has to outlast a LEVEL SWITCH, and that is the bit worth measuring rather than
     * guessing: the switch re-applies ~600 layer filters on a ~3s cadence, so a 3.2s window
     * (8 × 400ms) expired just as the tiles began arriving and the map stayed put. 20 × 500ms
     * gives it 10s, comfortably longer than the switch itself.
     */
    if (tries < 20) setTimeout(() => focusFeature(fid, tries + 1, padRight), 500);
    return;
  }
  try {
    map.fitBounds([[bounds[0], bounds[1]], [bounds[2], bounds[3]]], {
      padding: { top: 120, bottom: 120, left: 120, right: 120 + padRight },
      maxZoom: FOCUS_MAX_ZOOM, duration: 650, essential: true,
    });
  } catch(e){}
}

function focusChange(change) {
  if (!map) return;
  const hit = RESOLVED.find(r => r.change === change);
  if (!hit) return;                       // geometry not resolved yet — the map just doesn't move
  let minx=180, miny=90, maxx=-180, maxy=-90, n=0;
  hit.rings.forEach(r => r.forEach(([x,y]) => {
    n++; if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; }));
  if (!n) return;
  try {
    map.fitBounds([[minx,miny],[maxx,maxy]], {
      // room for the card, which sits above the shape and would otherwise cover the neighbours
      // that tell you where you are
      padding: { top: 190, bottom: 90, left: 90, right: 90 },
      maxZoom: FOCUS_MAX_ZOOM,
      duration: 650,
      essential: true,                    // survives prefers-reduced-motion being set
    });
  } catch(e){}
}

/**
 * The pane *opens* top-down — a floor plan is read flat — but rotate/tilt stay available (right-
 * drag or ctrl-drag, two-finger on touch). Only the SDK's own unrequested pitch is reset, and only
 * until we've framed; after that the camera is the user's.
 *
 * Tilting flips the SDK into 3D-model mode, which hides the indoor fills/symbols — ensureIndoorVisible()
 * on `idle` puts them back, so rotation no longer costs you the floor plan.
 */
function flattenOnce() {
  try {
    if (map.getPitch() !== 0) map.setPitch(0);
    if (map.getBearing() !== 0) map.setBearing(0);
  } catch(e){}
}

// Fit to the changes once — and only once they've ALL resolved, otherwise the first tile to render
// frames a single shop at max zoom. `force` gives up waiting for a change that never appears.
function maybeFrame(force) {
  if (framed || !RESOLVED.length) return;
  if (!force && RESOLVED.length < CHANGES.length) return;
  framed = true;
  frameChanges();
}

/**
 * Resolve every change against the current floor, then frame them. Tiles stream in, so this takes
 * several passes, and the whole building has to stay in view while it runs — queryRenderedFeatures()
 * only sees the viewport, so framing first strands every change outside the new view.
 *
 * Shared by boot and by a level switch. A switched-to floor needs exactly this pass and never used
 * to get one, so its changes stayed unresolved and unframed. `done(partial)` — partial means we
 * gave up with changes still unresolved.
 *
 * A pass belongs to the switch generation that started it: if a newer switch begins mid-flight this
 * one stands down rather than resolving, framing and reporting a floor we have already left.
 */
function resolveAndFrame(done) {
  const gen = switchGen;
  const stale = () => gen !== switchGen;
  let attempts = 0, widened = false;
  poll(() => {
      if (stale()) return true;
      attempts++;
      resolveChanges(); addFloorplan(); redraw();
      if (RESOLVED.length >= CHANGES.length) return true;
      if (!widened && attempts > 8) { widened = true; fitBuilding(); }
      return false;
    },
    () => {
      if (stale()) return;
      maybeFrame(true);
      // scrollToBuilding()'s animation lands *after* our fitBounds and snaps back to the building
      // view, so re-fit once it has settled.
      setTimeout(() => { if (stale()) return; framed = false; maybeFrame(true); }, 1500);
      done(false);
    },
    "change features",
    () => { if (stale()) return; maybeFrame(true); done(true); });
}

/* ── level / building switch ─────────────────────────────────────────────── */

let switching = false;      // one switch in flight at a time
let pendingTarget = null;   // newest request received while one was in flight (coalesced, not queued)
let switchGen = 0;          // bumped per switch; an older resolve pass stands down (see resolveAndFrame)
let started = false;        // start() has run; before that boot owns the camera, tiles and level

/**
 * Can this target exist at all? `map` is assigned during boot polling, long before boot has
 * finished, so a switch must not be judged only by whether the map object is there.
 *
 * Answered from the SDK's building list without moving anything: Concourse C has no B2, and asking
 * for one would otherwise spin the poll's full 30s budget before reporting a failure we could have
 * known instantly.
 */
function targetExists(t) {
  const bs = siteBuildings();
  if (!bs.length) return true;                       // list not in yet — let the poll decide
  const b = bs.find(x => x.id === (t.building || TARGET.building));
  if (!b) return false;
  return typeof t.level !== "number" || b.levels.some(l => l.index === t.level);
}

/**
 * Ask the map for a building/level. Returns true if a switch actually started.
 *
 * Idempotent by design: the app re-sends its target whenever we post `ready`, so a request for
 * where we already are must be a no-op, or app and map feed each other in a loop — re-opening the
 * building and re-framing the camera under the user's hands.
 *
 * Requests arriving mid-switch are held, not dropped, and only the newest is kept: clicking down
 * four floors should land on the fourth, not replay all four. Dropping them was half of the
 * stuck-on-L2 bug — a switch sent inside the latch window vanished without a trace.
 */
function requestTarget(t) {
  if (!t) return false;
  // Held, not dropped. Gate on `started`, not on `map`: the map object is assigned during boot
  // polling, so gating on it lets a switch start mid-boot and race boot's own
  // openTarget → ensureTiles → applyLevel sequence. start() drains whatever is waiting.
  if (!started || switching) { pendingTarget = t; return false; }
  const sameBuilding = !t.building || t.building === TARGET.building;
  const sameLevel = typeof t.level !== "number" || t.level === TARGET.level;
  if (sameBuilding && sameLevel) return false;
  if (!targetExists(t)) {
    post("error", { message: "no level " + t.level + " on the requested building" });
    post("switched", { level: levelInfo(), ok: false });   // tells the app to snap its selector back
    return false;
  }

  switching = true;
  switchGen++;
  try {
    if (t.building) TARGET.building = t.building;
    if (typeof t.level === "number") TARGET.level = t.level;
    RESOLVED = [];
    resolvePasses = 0;
    framed = false;
    SELECTED = null; HOVERED = null; renderTip();
    openTarget();
    applyLevel();

    // Nudge on boot's ~3s cadence, NOT on every 250ms tick as this used to: updateLayersForCurrentLevel()
    // setFilter()s ~600 layers, and at 4Hz that invalidates tiles faster than they can be parsed. The
    // old switch path was therefore stopping the new floor from ever painting — i.e. stopping its own
    // painted-feature gate from ever coming true.
    let nudges = 0;
    poll(() => {
        if (levelApplied()) return true;
        if (++nudges % 12 === 0) applyLevel();
        return false;
      },
      () => endSwitch(true),
      "level " + TARGET.level + " to apply",
      () => endSwitch(false));
  } catch(e) {
    // The latch must never outlive its switch — that is the whole failure mode being fixed here.
    post("error", { message: "switch: " + e.message });
    if (switching) endSwitch(false);
    return false;
  }
  return true;
}

// Both branches release the latch and report, so the app always learns what the map settled on. On
// failure that is the floor it never left, which snaps the level selector back to the truth instead
// of leaving it pointing at a floor the map never reached.
function endSwitch(ok) {
  switching = false;
  const queued = pendingTarget;
  pendingTarget = null;
  // Superseded — don't spend a resolve pass on a floor we're already leaving.
  if (queued && requestTarget(queued)) return;
  // A failed switch must not leave TARGET pointing at a floor we never reached. Three things read
  // TARGET independently — the outline filter, ensureLevel()'s retry, and everything downstream of
  // levelInfo() — so a stale TARGET means they disagree, and the app gets told a level the map
  // isn't rendering. Roll back to what the SDK actually holds: intent lives in the app, the map
  // reports and holds reality, and the app can ask again if it still wants that floor.
  if (!ok) rollbackTarget();
  // Both branches re-point the outline: it follows TARGET, so leaving it behind would draw the
  // old floor's walls under the new one either way.
  addFloorplan(); applyPrefs(); redraw();
  if (ok) resolveAndFrame(() => post("features", { features: levelFeatureNames(), types: levelTypeCounts(), forLevel: { building: TARGET.building, level: TARGET.level } }));
  else post("switched", { level: levelInfo(), ok: false });
}

function rollbackTarget() {
  try {
    const uc = pw.getUiController(), b = uc.getCurrentBuilding();
    const idx = uc.getMapViewController().levelIndex;
    if (b && b.buildingInternalIdentifier) TARGET.building = b.buildingInternalIdentifier;
    if (typeof idx === "number") TARGET.level = idx;
  } catch(e){}
}

/* ── boot ───────────────────────────────────────────────────────────────── */

function start() {
  window.__map = map;                 // exposed for debugging
  // Announce as soon as the map is usable. Waiting until every change has resolved meant a screen
  // with no changes (Map Content, Editing Level) never got its prefs — so it stayed greyscale.
  post("ready", { level: levelInfo(), buildings: siteBuildings(), features: levelFeatureNames(), types: levelTypeCounts(), forLevel: { building: TARGET.building, level: TARGET.level } });
  window.__state = () => ({ changes: CHANGES, resolved: RESOLVED.map(r => r.change.name) });
  flattenOnce();
  addFloorplan();
  applyPrefs();
  resolveChanges();
  redraw();
  map.on("render", redraw);
  /**
   * **Hover anything editable** (Olcay, 2026-08-14). The diff shapes carry their own listeners;
   * this is for every other feature on the floor, hit-tested against the SDK's own vector layers.
   *
   * Only editable content responds — `EDITABLE_TYPES` is the tree's POI/Structural split, posted
   * by the app. Walls, roads and circulation space are the floor plan, not content somebody
   * curates, and lighting up 715 of them would make the hover meaningless.
   *
   * A change under the cursor wins and this stands aside: that card says strictly more (its type,
   * its detail, and where allowed its decision control).
   */
  map.on("mousemove", ev => {
    // Everyone else sees where you point, wherever you point — this is not gated on hovering
    // something, because a cursor resting on blank floor is still information.
    post("cursor", { lng: ev.lngLat.lng, lat: ev.lngLat.lat });
    /**
     * ⚠️ **While a shape is being edited, nothing else may claim the pointer** (Olcay, 2026-08-15:
     * *"edit-geometry nodes should prevent any overlay to trigger"*). The hover card was drawing
     * itself straight over the vertex handles — covering the very points you were reaching for, and
     * inviting a "Click to edit" on a feature you are already editing.
     */
    if (GEOM) {
      const dropCard = () => {
        if (HOVER_FEATURE) { HOVER_FEATURE = null; highlightFeatures(null); renderTip(); }
      };
      // Laying a cut: the far end follows the pointer. In lng/lat, like the rings — the map can be
      // panned mid-cut and the anchor has to stay on the floor, not on the screen.
      if (GEOM.mode === "split") {
        dropCard();
        map.getCanvas().style.cursor = "crosshair";
        if (GEOM.cutA) {
          /**
           * The cut gets the same guides as everything else — a wall is laid at a right angle far
           * more often than at 37°, and until now the only way to cut squarely was to aim by eye.
           * The anchor is the cut's first click, so the angle guide measures the cut itself.
           */
          const a = map.project(GEOM.cutA);
          const g = GEOM.snap
            ? resolveGuides([a.x, a.y], ev.point.x, ev.point.y,
                            GEOM.cutRefs || [], geomSnapping(ev.originalEvent),
                            GEOM.cutBases || [])
            : { x: ev.point.x, y: ev.point.y, guides: [] };
          const q = map.unproject([g.x, g.y]);
          GEOM.cutB = [q.lng, q.lat];
          GEOM.guides = g.guides;
          GEOM.guideAt = [g.x, g.y];
          geomDraw();
        }
        return;
      }
      /**
       * **The feature being edited owns the pointer — but only its own.**
       *
       * Olcay, 2026-08-15: *"edit-geometry nodes should prevent any overlay to trigger"* — the card
       * was drawing itself straight over the vertex handles you were reaching for. That is about
       * the shape you are editing. Over a DIFFERENT feature the card is the only thing that says
       * you may click it, and now that clicking one actually switches to it, suppressing it there
       * would hide the feature behind an invisible affordance.
       */
      const over = editableAt(ev.point);
      const overFid = over && over.properties && over.properties.fid;
      if (!overFid || overFid === GEOM.fid) {
        dropCard();
        map.getCanvas().style.cursor = "";
        return;
      }
      // …otherwise fall through and let the ordinary hover card do its job.
    }
    if (shown()) return;                              // a change's card owns the cursor
    const f = editableAt(ev.point);
    const fid = f && f.properties && f.properties.fid;
    if (!f) {
      if (HOVER_FEATURE) { HOVER_FEATURE = null; highlightFeatures(null); renderTip(); }
      map.getCanvas().style.cursor = "";
      return;
    }
    map.getCanvas().style.cursor = "pointer";
    if (HOVER_FEATURE && HOVER_FEATURE.fid === fid) {  // same feature, just moved — reposition only
      HOVER_FEATURE.x = ev.point.x; HOVER_FEATURE.y = ev.point.y + 18;
      renderTip();
      return;
    }
    HOVER_FEATURE = {
      fid,
      name: f.properties.name || "",
      typeLabel: prettyType(f.properties),
      x: ev.point.x,
      y: ev.point.y + 18,
      below: true,
    };
    highlightFeatures({ fid });                        // the SDK's own selection layer lights it
    renderTip();
  });

  // Leaving the canvas has to clear it — the container listener below only covers the card.
  map.on("mouseout", () => {
    if (!HOVER_FEATURE) return;
    HOVER_FEATURE = null; highlightFeatures(null); renderTip();
    map.getCanvas().style.cursor = "";
  });

  map.on("move", postCam);
  map.on("move", redraw);
  map.on("move", drawPeers);   // the cursor is at a coordinate, so panning must re-project it
  map.on("move", drawEditing); // and so is the chip pinned to a feature
  map.on("move", geomDraw);    // the outline is in lng/lat, so panning re-projects it
  map.on("idle", () => {
    ensureLevel();
    ensureIndoorVisible();
    hideBuildingChrome(); // the SDK re-shows its layers after switches and 3D recoveries
    relaxPtrMinzoom();
    if (resolveChanges()) { addFloorplan(); applyPrefs(); redraw(); }
  });
  // The SDK treats a map click as wayfinding navigation — clicking anywhere on the building
  // footprint re-focuses and zooms to it, which is hostile in a review pane. Swallow the click in
  // the capture phase before MapLibre's own listener sees it (mousedown/move still pan and zoom).
  // Overriding uiController.MapView_onMapClicked does NOT work — the SDK registered the original
  // function by reference. Dismissal is NOT done here: over the shapes a `click` is never produced
  // at all (see the shapes' mouseup listener), so it happens on mouseup below.
  document.getElementById("map").addEventListener("click", ev => { ev.stopPropagation(); }, true);

  /**
   * Press and release, the only two mouse events this map can rely on.
   *
   * The press is recorded wherever it lands — its target is not trustworthy — and the release
   * decides. A shape's own `mouseup` selects it (see `redraw`); this one handles the other half:
   * releasing on bare map dismisses a pinned card, which is the "click out" exit.
   */
  document.addEventListener("mousedown", ev => { DOWN_AT = [ev.clientX, ev.clientY]; }, true);
  document.addEventListener("mouseup", ev => {
    const tap = isTap(ev);
    DOWN_AT = null;                      // consumed either way
    /**
     * Dismiss only on a release **on the map itself**, stated positively.
     *
     * The first version excluded shapes and the card and dismissed on everything else — which
     * silently included the zoom buttons, so zooming with a card pinned would close it. `#hl`
     * (the shapes) and `#tip` and `#zoomctl` are all siblings of `#map`, so asking "is the
     * release inside #map?" excludes every one of them by construction, and keeps excluding any
     * chrome added later.
     */
    if (!tap || !document.getElementById("map").contains(ev.target)) return;
    /**
     * **Laying a cut takes the release first**, before anything else can read it as a selection or
     * a dismissal. Same `mouseup` + `isTap` as the rest of this file: a press that travelled was a
     * pan, so you can still drag the map into position between the two clicks of a cut.
     */
    if (GEOM && GEOM.mode === "split" && map) {
      const rect = map.getCanvas().getBoundingClientRect();
      geomCutClick(map.unproject([ev.clientX - rect.left, ev.clientY - rect.top]));
      return;
    }
    // A plain click on bare floor drops the corner selection — the counterpart to shift-marquee,
    // and the only way out of one besides Escape.
    if (GEOM && GEOM.sel && GEOM.sel.size && !ev.shiftKey) {
      GEOM.sel.clear();
      geomDraw(); post("geomstate", geomState());
      return;
    }
    if (SELECTED) select(SELECTED);      // click out — dismiss
    else if (HOVERED) hover(null);
    /**
     * **Opening a feature hangs off the release too**, and for the reason this file already
     * learned the hard way: `map.on("click")` never fires here. Verified 2026-08-14 — the canvas
     * receives a DOM `click`, but MapLibre's own click never reaches a handler, so "Click to edit"
     * did nothing. `mouseup` + `isTap` is the pattern every other selection here uses; this one
     * was written against what ought to work instead of what does.
     */
    /**
     * ⚠️ **This used to be gated on `!GEOM`, which made it impossible to switch features.**
     *
     * Selecting a feature IS edit mode here, so `GEOM` is set from the moment a panel opens — and
     * the guard therefore meant "once you have opened anything, clicking another feature does
     * nothing at all". Olcay, 2026-08-15: *"clicking other feature should switch to that feature
     * edit"*. Quite right; it never could.
     *
     * The gate it was reaching for is narrower, and is already handled elsewhere: a click on a
     * vertex handle never arrives here, because the handles live in the `#geom` overlay rather than
     * inside `#map`, and the guard above requires a release inside `#map`. A drag is excluded by
     * `isTap`. What is left is a genuine click on bare floor — and the only one worth ignoring is
     * one that lands on the feature already open.
     */
    else if (map && !shown()) {
      const rect = map.getCanvas().getBoundingClientRect();
      const f = editableAt([ev.clientX - rect.left, ev.clientY - rect.top]);
      const fid = f && f.properties && f.properties.fid;
      if (fid && !(GEOM && GEOM.fid === fid))
        post("featureclick", { fid, props: plainProps(f.properties) });
    }
  });

  // Zoom control (Figma 2103:22178). MapLibre's own eased zoom; no-ops until the map exists.
  document.getElementById("zoomin").addEventListener("click", () => { if (map) map.zoomIn(); });
  document.getElementById("zoomout").addEventListener("click", () => { if (map) map.zoomOut(); });

  /**
   * Every way a hover can end, each reporting to `endHoverUnless`.
   *
   * A path's own `mouseleave` can't be trusted on its own — `redraw()` rebuilds every path per
   * render frame (MapLibre renders continually for symbol fades), so the hovered element is often
   * destroyed before its leave event fires. Hence the surfaces below, which are stable.
   *
   * `#tip` and `#hl` are siblings of `#map`, so each needs its own listener: a `mousemove` on
   * `#map` fires only over *bare* map and never sees the card or the shapes.
   */
  const mapEl = document.getElementById("map");
  mapEl.addEventListener("mousemove", ev => endHoverUnless(ev.target));
  // leaving the map for the panel, the chrome, or another window — the case that used to strand
  // the card on screen indefinitely, because no further mousemove was ever coming
  mapEl.addEventListener("mouseleave", ev => endHoverUnless(ev.relatedTarget));
  // leaving the card itself; `relatedTarget` keeps a trip back to its own shape from flickering
  tip.addEventListener("mouseleave", ev => endHoverUnless(ev.relatedTarget));
  document.getElementById("hl").addEventListener("mouseleave", ev => endHoverUnless(ev.relatedTarget));
  // out of the document entirely (relatedTarget is null on the way out of the window)
  document.addEventListener("mouseout", ev => { if (!ev.relatedTarget) endHoverUnless(null); });
  window.addEventListener("blur", () => endHoverUnless(null));

  map.on("movestart", () => { if (HOVERED) hover(null); });

  // Escape deselects, like every other overlay in the app. Pinned only — a hover card needs no
  // dismissing, it dies when you look away.
  document.addEventListener("keydown", ev => {
    /**
     * **Delete removes the selected corners** (Olcay, 2026-08-15). Safe to bind bare, because this
     * document is the map and has no text input in it — the properties panel lives in the parent,
     * so typing a name there never reaches this listener.
     */
    if ((ev.key === "Delete" || ev.key === "Backspace") &&
        GEOM && GEOM.kind === "area" && GEOM.sel.size) {
      ev.preventDefault();
      geomDeleteSelected();
      return;
    }
    if (ev.key !== "Escape") return;
    // Escape peels one layer at a time, innermost first — and never the edit itself: dropping the
    // panel because somebody thought better of one click would take every unsaved change with it.
    if (GEOM && GEOM.mode === "split") {
      if (!geomCancelCut()) geomSetMode("vertices");
      return;
    }
    if (GEOM && GEOM.sel && GEOM.sel.size) {
      GEOM.sel.clear();
      geomDraw(); post("geomstate", geomState());
      return;
    }
    if (SELECTED) select(SELECTED);
  });

  /**
   * **Shift + drag across the map marquees the corners inside it** (Olcay, 2026-08-15: *"select
   * multiple points with lasso select or shift marquee select"*).
   *
   * A rectangle rather than a freehand lasso: it is one drag either way, but a rectangle can be
   * aimed — you can see what it will catch before you let go — and a lasso's own path has to be
   * hit-tested, which is a lot of machinery for corners that sit on a building grid anyway.
   *
   * ⚠️ Shift+drag was **MapLibre's box zoom**; `geomBegin` disables it for as long as the editor is
   * open. Without that, every marquee would also zoom the map out from under itself.
   *
   * Bubble phase, not capture: a handle's own `mousedown` calls `stopPropagation`, so a
   * shift-click ON a corner reaches its toggle and never starts a marquee.
   */
  document.addEventListener("mousedown", ev => {
    // Reshape only: corners are the subject of that mode and of no other.
    if (!GEOM || GEOM.kind !== "area" || GEOM.mode !== "vertices") return;
    if (!ev.shiftKey || ev.button !== 0) return;
    if (!document.getElementById("map").contains(ev.target)) return;
    ev.preventDefault();
    const rect = map.getCanvas().getBoundingClientRect();
    const at = e => {
      const q = map.unproject([e.clientX - rect.left, e.clientY - rect.top]);
      return [q.lng, q.lat];
    };
    GEOM.band = { a: at(ev), b: at(ev) };
    try { map.dragPan.disable(); } catch (e) {}
    const move = e => { if (GEOM && GEOM.band) { GEOM.band.b = at(e); geomDraw(); } };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      try { map.dragPan.enable(); } catch (e) {}
      if (!GEOM || !GEOM.band) return;
      // Additive: shift is already down, and shift-to-add is what it means everywhere else.
      geomSelectIn(GEOM.band.a, GEOM.band.b, true);
      GEOM.band = null;
      geomDraw(); post("geomstate", geomState());
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });

  resolveAndFrame(partial => post("ready", { changes: RESOLVED.length, level: levelInfo(), features: levelFeatureNames(),
    types: levelTypeCounts(), forLevel: { building: TARGET.building, level: TARGET.level },
    buildings: siteBuildings(), partial }));

  // Boot is done: switches may run from here. Anything that arrived while boot owned the map was
  // held rather than dropped on the floor, so drain it now.
  started = true;
  const queued = pendingTarget;
  pendingTarget = null;
  requestTarget(queued);
}

document.addEventListener("DOMContentLoaded", () => {
  const missing = missingConfig();
  if (missing.length) {
    document.getElementById("map").innerHTML =
      '<div style="position:absolute;inset:0;display:grid;place-items:center;padding:24px;' +
      'font:13px/1.6 \'Readex Pro\',system-ui,sans-serif;color:#5d626f;text-align:center">' +
      '<div><b style="color:#1F2328">Map configuration missing</b><br>No ' + missing.join(", ") +
      '.<br>The app passes these on the query string from its environment ' +
      '(VITE_POINTR_*). Opening this page directly needs them too.</div></div>';
    post("error", { message: "missing map config: " + missing.join(", ") });
    return;
  }
  try {
    const options = new PointrWebSDK.Options({
      container: "map",
      baseUrl: CONN.baseUrl,
      clientIdentifier: CONN.client,
      licenseKey: CONN.licence,
      mapMaxZoom: 21,
      pitch: 0,                         // a floor plan is read top-down; a pitched camera also
      bearing: 0,                       // flips the SDK into 3D-model mode (see lockFlat)
      siteInternalIdentifier: TARGET.site,
      buildingInternalIdentifier: TARGET.building,
      levelIndex: TARGET.level,
      /**
       * The persona this map is rendered for. The SDK matches it against each enabled persona's
       * `personaIdentifier` OR its `key`, so the plain key (`facilityManager`) is enough; it then
       * takes that persona's `styleUrl` as the map's style, and hides any POI whose `mapPersonas`
       * excludes the key. Left out entirely, the client's default persona applies.
       */
      ...(CONN.persona ? { personaIdentifier: CONN.persona } : {}),
      // this pane is a review viewport, not a wayfinding widget
      isSearchEnabled: false,
      isPoiDetailsEnabled: false,
      isZoomControlEnabled: false,
      isLanguageSelectorEnabled: false,
      isNavigationEnabled: false,
      isQuickAccessEnabled: false,
      isAppBannerEnabled: false,
    });
    pw = new PointrWebSDK.MapWidget(options);
    window.pw = pw;                   // exposed for debugging

    pw.start();

    // 1. map + site list ready → 2. open Dubai/Concourse B → 3. tile URL → 4. indoor features.
    // Gated on the SDK's `dataLoaded` event with a poll as backstop (`pw.isDataLoaded` stays false
    // even on a fully loaded widget, so it can't be trusted). boot() is idempotent.
    let booted = false;
    const sdkReady = () => {
      map = getMap();
      hookMapErrors();
      const mvc = (() => { try { return pw.uiController.mapViewController; } catch(e) { return null; } })();
      return !!(map && mvc && mvc.sites && mvc.sites.length);
    };
    const boot = () => {
      if (booted || !sdkReady()) return;
      booted = true;
      openTarget();
      applyLevel();
      ensureTiles(() => {
        try { pw.uiController.mapViewController.scrollToBuilding(TARGET.building); } catch(e){}
        applyLevel();                                  // now that the tiles are real, pin level 2
        // Nudge the level every ~3s, NOT every tick: updateLayersForCurrentLevel() setFilter()s
        // ~600 layers, and doing that at 4Hz invalidates tiles faster than they can be parsed —
        // the map then renders nothing at all.
        let nudges = 0;
        poll(() => {
          if (levelIsRendering()) return true;
          if (++nudges % 12 === 0) applyLevel();
          return false;
        }, start, "level " + TARGET.level + " features");
      });
    };
    try { pw.on("dataLoaded", boot); } catch(e){}
    poll(sdkReady, boot, "sdk data");
  } catch(e) { post("error", { message: e.message }); }
});

// live decisions + map view preferences from the app
/* ── geometry editing ─────────────────────────────────────────────────────────────────────────
 *
 * Direct manipulation of a feature's outline, in the map's own coordinate space.
 *
 * **Rings are held in lng/lat, never in pixels.** Every operation converts to screen space, does
 * its arithmetic there because that is where the cursor lives, and converts straight back. Holding
 * pixels would silently rewrite the shape on every zoom.
 *
 * **Edits are local**, like every other edit in this prototype — nothing is written to Pointr
 * Cloud. The app is told on commit so the panel and the tree can agree with the map.
 *
 * ⚠️ **`split` is deliberately absent.** Cutting a polygon properly means walking the ring,
 * inserting every intersection with the cut line and re-assembling two valid rings — and doing it
 * for concave shapes with multiple crossings. A version that only works on convex shapes would be
 * a trap, so it is recorded as unbuilt rather than shipped half-right.
 */
let GEOM = null;

const SNAP_PX = 10;
const HANDLE_R = 5;

function geomBegin(fid) {
  const f = geomFind(fid);
  if (!f) {
    /**
     * ⚠️ Clear the editor rather than just refusing. This used to `return` with `GEOM` untouched,
     * so opening a feature whose tiles had not loaded left the PREVIOUS feature's handles on the
     * map while the panel showed the new one — every drag then edited a shape nobody had selected.
     */
    GEOM = null;
    try { map.boxZoom.enable(); } catch (e) {}
    geomDraw();
    post("geomerror", { fid, message: "no geometry on this floor yet" });
    post("geomstate", { editing: false });
    return;
  }
  /**
   * ⚠️ **MapLibre owns shift+drag** — it is bound to `boxZoom`. The marquee needs it, so it is
   * taken away for as long as the editor is open and given straight back in `geomEnd`.
   */
  try { map.boxZoom.disable(); } catch (e) {}
  GEOM = {
    fid,
    kind: f.kind,
    // deep copies: the source stays untouched until commit
    rings: f.kind === "area" ? JSON.parse(JSON.stringify(f.rings)) : [],
    point: f.kind === "point" ? f.point.slice() : null,
    history: [],
    future: [],
    snap: true,
    mode: "vertices",
    drag: null,
    /**
     * The selected vertices, as `"ri:ci"` keys (Olcay, 2026-08-15: *"select multiple points with
     * lasso select or shift marquee select and move them at the same time and delete should delete
     * them"*). A Set, so shift-toggling is O(1) and order never matters.
     *
     * Deliberately NOT part of the undo snapshot: it is what you have highlighted, not what the
     * shape is. Undo clears it instead, because indices shift under a restore and a selection
     * pointing at the wrong corners is worse than no selection.
     */
    sel: new Set(),
    /** The marquee being dragged, in lng/lat: `{ a, b }`. */
    band: null,
    /** The live rotate/scale readout while a transform handle is down: `{ text, snapped, x, y }`. */
    xform: null,
    /** What snapping has caught this frame, for the indicator: `{ x, y, kind }` in screen space. */
    snapHit: null,
    /** The guides in force this frame — see the guide engine. Drawn, never persisted. */
    guides: null,
    /** Where the guides put the point, in screen space — what the tracking line runs to. */
    guideAt: null,
    /**
     * Which piece each ring belongs to, parallel to `rings`. Everything starts as piece 0 — one
     * feature, one piece, however many rings it arrived with — and `geomApplyCut` mints new ids.
     * The count of distinct ids is how many pieces the feature is in.
     */
    pieceOf: [],
    nextPiece: 1,
    /** The cut being laid, both ends in lng/lat. `cutB` tracks the pointer until the second click. */
    cutA: null,
    cutB: null,
  };
  GEOM.pieceOf = GEOM.rings.map(() => 0);
  GEOM.original = geomSnap();
  geomDraw();
  post("geomstate", geomState());
}

/**
 * A restore point. Rings ALONE are not enough once splitting exists: undoing a split has to put the
 * piece map back too, or the shape returns to one outline while the app still believes it is two.
 */
function geomSnap() {
  return {
    rings: JSON.parse(JSON.stringify(GEOM.rings)),
    point: GEOM.point ? GEOM.point.slice() : null,
    pieceOf: GEOM.pieceOf.slice(),
    // The counter travels with the state, so undo rewinds it and redo replays it — otherwise a
    // split, an undo and another split would hand the same id to two different pieces.
    nextPiece: GEOM.nextPiece,
  };
}

function geomRestore(s) {
  GEOM.rings = JSON.parse(JSON.stringify(s.rings));
  GEOM.point = s.point ? s.point.slice() : null;
  GEOM.pieceOf = s.pieceOf.slice();
  GEOM.nextPiece = s.nextPiece;
  // Indices move under a restore, so a kept selection would highlight the wrong corners.
  GEOM.sel.clear();
}

/* ── selection ─────────────────────────────────────────────────────────────── */

const selKey = (ri, ci) => ri + ":" + ci;

/**
 * Any structural change CLEARS the selection rather than trying to carry it.
 *
 * Dropping only the out-of-range keys would be worse than useless: removing one corner shifts every
 * later index down by one, so the surviving keys would still be *valid* and would now highlight
 * the wrong corners — and the next drag would move corners the user never picked. Clearing is
 * honest and takes one shift-drag to redo.
 */
function geomClearSel() {
  if (GEOM && GEOM.sel) GEOM.sel.clear();
}

/**
 * Everything inside the marquee. Screen space, because the marquee is a rectangle **on screen** —
 * in lng/lat it would be a quadrilateral the moment the map is rotated.
 */
function geomSelectIn(a, b, additive) {
  if (!GEOM || GEOM.kind !== "area") return;
  const pa = map.project(a), pb = map.project(b);
  const x0 = Math.min(pa.x, pb.x), x1 = Math.max(pa.x, pb.x);
  const y0 = Math.min(pa.y, pb.y), y1 = Math.max(pa.y, pb.y);
  if (!additive) GEOM.sel.clear();
  GEOM.rings.forEach((ring, ri) => {
    for (let ci = 0; ci < ring.length - 1; ci++) {
      const p = map.project(ring[ci]);
      if (p.x >= x0 && p.x <= x1 && p.y >= y0 && p.y <= y1) GEOM.sel.add(selKey(ri, ci));
    }
  });
}

/**
 * Delete every selected vertex.
 *
 * ⚠️ **A ring cannot go below a triangle.** If the selection would take one under, the ring is left
 * alone rather than mangled — unless the feature has other rings, in which case deleting the whole
 * ring is what the user plainly meant. Whatever is refused is said out loud; silently keeping
 * points somebody asked to delete is how you lose trust in a delete key.
 */
function geomDeleteSelected() {
  if (!GEOM || GEOM.kind !== "area" || !GEOM.sel.size) return;
  const byRing = new Map();
  for (const k of GEOM.sel) {
    const [ri, ci] = k.split(":").map(Number);
    if (!byRing.has(ri)) byRing.set(ri, new Set());
    byRing.get(ri).add(ci);
  }
  const rings = [], pieceOf = [];
  let removed = 0, refused = 0;

  GEOM.rings.forEach((ring, ri) => {
    const keep = () => { rings.push(ring); pieceOf.push(GEOM.pieceOf[ri]); };
    const drop = byRing.get(ri);
    if (!drop) return keep();
    const open = ring.slice(0, -1);
    const kept = open.filter((_, ci) => !drop.has(ci));
    if (kept.length >= 3) {                    // still a shape — take the corners out
      removed += open.length - kept.length;
      kept.push(kept[0].slice());
      rings.push(kept); pieceOf.push(GEOM.pieceOf[ri]);
    } else if (GEOM.rings.length > 1) {        // selecting all of one piece means delete the piece
      removed += open.length;
    } else {                                   // the last shape: refuse rather than mangle
      refused++;
      keep();
    }
  });

  if (!removed) {
    post("geomerror", { fid: GEOM.fid,
      message: "a shape needs at least three corners — select fewer of them" });
    return;
  }
  geomPush();
  GEOM.rings = rings;
  GEOM.pieceOf = pieceOf;
  GEOM.sel.clear();
  if (refused) {
    post("geomerror", { fid: GEOM.fid,
      message: "one shape kept its corners — three is the minimum" });
  }
  geomDraw(); post("geomstate", geomState());
}

/** How many separate pieces the feature is in. `1` is a feature nobody has split. */
function geomPieces() {
  return GEOM ? new Set(GEOM.pieceOf).size : 1;
}

/**
 * Save the shape and carry on editing — what the panel's **Update** means now that geometry is
 * simply part of edit mode. Re-baselining is the point: without it the editor would still report
 * itself dirty against the outline you just replaced.
 */
function geomCommit() {
  if (!GEOM) return;
  post("geometry", { fid: GEOM.fid, rings: GEOM.rings, point: GEOM.point, pieces: geomPieces() });
  GEOM.original = geomSnap();
  GEOM.history = [];
  GEOM.future = [];
  post("geomstate", geomState());
}

function geomEnd(commit) {
  if (!GEOM) return;
  if (commit) post("geometry", { fid: GEOM.fid, rings: GEOM.rings, point: GEOM.point, pieces: geomPieces() });
  GEOM = null;
  // Shift+drag goes back to being MapLibre's box zoom — see geomBegin.
  try { map.boxZoom.enable(); } catch (e) {}
  geomDraw();
  post("geomstate", { editing: false });
}

/**
 * What kind of thing is this feature, and where is it?
 *
 * `{ kind: "area", rings }` or `{ kind: "point", point }`, or `null` if the floor has not loaded
 * it. **A great many POIs are points** (Olcay, 2026-08-15: *"if the geometry is point - there is no
 * way to reshape it"*) — a point has no outline to reshape, but it can certainly be moved, and
 * before this it could not even be opened without throwing.
 *
 * Rings win when a feature somehow has both: the outline is the editable thing.
 */
function geomFind(fid) {
  const rings = [];
  let point = null;
  for (const f of featuresWithFid(fid)) {
    const g = f.geometry;
    if (g.type === "Point") { if (!point) point = g.coordinates.slice(); }
    else if (g.type === "MultiPoint") { if (!point && g.coordinates[0]) point = g.coordinates[0].slice(); }
    else rings.push(...ringsOuter(f));
  }
  if (rings.length) return { kind: "area", rings };
  if (point) return { kind: "point", point };
  return null;
}

function geomState() {
  return GEOM
    ? {
        editing: true, fid: GEOM.fid, mode: GEOM.mode, snap: GEOM.snap,
        canUndo: GEOM.history.length > 0, canRedo: GEOM.future.length > 0,
        // Compared against the baseline, not "did anything happen" — drag a point and put it back
        // and you have changed nothing, so Update must not light up.
        dirty: JSON.stringify(geomSnap()) !== JSON.stringify(GEOM.original),
        pieces: geomPieces(),
        // Has the first click of a cut landed? The toolbar says what the next click will do.
        cutting: GEOM.mode === "split" && !!GEOM.cutA,
        // A point has no outline: the toolbar drops every tool that would be a lie on one.
        kind: GEOM.kind,
        selected: GEOM.sel.size,
      }
    : { editing: false };
}

/** Snapshot before a change. Redo is dropped, as it is in every editor that has ever felt right. */
function geomPush() {
  if (!GEOM) return;
  GEOM.history.push(geomSnap());
  if (GEOM.history.length > 50) GEOM.history.shift();
  GEOM.future = [];
}

function geomUndo() {
  if (!GEOM || !GEOM.history.length) return;
  GEOM.future.push(geomSnap());
  geomRestore(GEOM.history.pop());
  geomDraw(); post("geomstate", geomState());
}

function geomRedo() {
  if (!GEOM || !GEOM.future.length) return;
  GEOM.history.push(geomSnap());
  geomRestore(GEOM.future.pop());
  geomDraw(); post("geomstate", geomState());
}

function geomReset() {
  if (!GEOM) return;
  geomPush();
  geomRestore(GEOM.original);
  geomDraw(); post("geomstate", geomState());
}

/** Changing mode always abandons a half-laid cut — a dangling anchor is a trap on the next click. */
function geomSetMode(mode) {
  if (!GEOM) return;
  GEOM.mode = mode;
  GEOM.cutA = GEOM.cutB = null;
  GEOM.cutRefs = null;
  GEOM.cutBases = null;
  GEOM.guides = GEOM.guideAt = null;
  geomDraw(); post("geomstate", geomState());
}
function geomToggleSnap() { if (GEOM) { GEOM.snap = !GEOM.snap; post("geomstate", geomState()); } }

/* ── snapping ──────────────────────────────────────────────────────────────────
   Screen distance throughout, never ground distance: snapping is about what the eye reads as
   touching, and a metre is a lot zoomed out and nothing zoomed in.

   ⚠️ **Corners were the only thing you could snap to** until 2026-08-16 (Olcay: *"snap should also
   snap to lines of other features' geometries"*). A room shares a WALL with its neighbour far more
   often than it shares a corner, so the one case snapping existed for was the case it could not do.

   It is indexed rather than scanned because of where it is now used: the whole-shape move tests
   every one of the dragged feature's vertices on every frame, and a linear pass over every rendered
   feature per vertex per frame is thousands of times more work than a frame has. The index is built
   once per gesture — the map cannot move mid-drag, so screen coordinates stay valid for its life. */

/* SNAP-ENGINE-START — extracted and tested by scratch/geometry.test.mjs; keep DOM- and map-free. */

/** Nearest point on the segment `1→2` to `p`, clamped to the segment's ends. */
function segClosest(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const L2 = dx * dx + dy * dy;
  if (L2 < 1e-12) return [x1, y1];
  let t = ((px - x1) * dx + (py - y1) * dy) / L2;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return [x1 + dx * t, y1 + dy * t];
}

/**
 * A uniform grid over the snap candidates. `cell` must be ≥ the snap radius, so a query only ever
 * has to look at its own cell and the eight around it.
 */
function buildSnapIndex(verts, segs, cell) {
  const g = new Map();
  const add = (gx, gy, item) => {
    const k = gx + ":" + gy;
    const a = g.get(k);
    if (a) a.push(item); else g.set(k, [item]);
  };
  for (const v of verts) add(Math.floor(v[0] / cell), Math.floor(v[1] / cell), { v });
  for (const s of segs) {
    // Walked in cell-sized steps rather than bucketed by bounding box: a long diagonal's box covers
    // a great many cells it never passes through, and every one of those is a wasted query later.
    const len = Math.hypot(s[2] - s[0], s[3] - s[1]);
    const steps = Math.max(1, Math.ceil(len / cell));
    let last = "";
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const gx = Math.floor((s[0] + (s[2] - s[0]) * t) / cell);
      const gy = Math.floor((s[1] + (s[3] - s[1]) * t) / cell);
      const k = gx + ":" + gy;
      if (k !== last) { add(gx, gy, { s }); last = k; }
    }
  }
  return { g, cell };
}

/**
 * How much nearer an edge must be than a corner before it wins, in pixels.
 *
 * ⚠️ **This was `Infinity` in effect** — the first version returned a corner whenever one was in
 * range at all, on the reasoning that a corner is a place somebody meant. That reasoning is right
 * and the rule built from it was wrong: floor-plan outlines are dense enough that *some* corner is
 * nearly always within the radius too, so the edge was found, then always lost. Edge snapping was
 * unreachable in exactly the geometry it was built for (Olcay, 2026-08-16: *"snap to edge of other
 * features doesn't work … surprising that we can snap to other features nodes but not edges"* —
 * and the surprise is the tell: it was never the data, both came from the same loop).
 *
 * A bias keeps the intent without the flaw: a corner still wins ties and near-ties, so meeting one
 * stays easy, but an edge that is *clearly* closer is what you were aiming at and takes it.
 */
const SNAP_CORNER_BIAS = 5;

/**
 * The best snap for a screen point, or `null`. Corners are preferred, but only by
 * `SNAP_CORNER_BIAS` — see the note there for why an absolute preference was a bug.
 */
function snapQuery(idx, px, py, radius) {
  if (!idx) return null;
  const c = idx.cell;
  const gx = Math.floor(px / c), gy = Math.floor(py / c);
