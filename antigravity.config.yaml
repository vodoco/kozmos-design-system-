# antigravity.config.yaml
project_name: kozmos-design-system
version: 1.0.0

# 1. AI Context - Bind the extensive documentation
context:
  include:
    - .ai-skills/role-coordinator.md
    - .ai-skills/role-devops.md
    - .ai-skills/role-token-architect.md
    - .ai-skills/design-philosophy.md
    - .ai-skills/code-patterns.md
    - .ai-skills/component-creation-guide.md
    - .ai-skills/token-implementation.md
    - PROJECT_SCOPE.md
    - package.json
    - turbo.json
  
  # Exclude noise
  exclude:
    - node_modules/**
    - dist/**
    - .git/**
    - coverage/**

# 2. Agent Rules - Enforce Design System patterns
rules:
  - name: "Strict Role Adherence"
    content: |
      Adopt one of the defined roles (Coordinator, DevOps, Token Architect) based on the task.
      - **Coordinator**: Planning, Architecture, Task Management.
      - **DevOps**: Build, Deployment, Infrastructure.
      - **Token Architect**: Design Tokens, Style Dictionary.
      - **Builder**: Implementation of components (React/iOS/Android).

  - name: "Strict Token Usage"
    content: |
      NEVER hardcode values (colors, spacing, etc.). 
      ALWAYS use Design Tokens from @kozmos/tokens.
      Refer to `.ai-skills/token-implementation.md` for the token taxonomy.
  
  - name: "Component Creation"
    content: |
      When complying with a request to create a component:
      1. Consult `.ai-skills/component-creation-guide.md` first.
      2. Ensure multi-platform support (React, iOS, Android) is considered or stubbed.
      3. Use the Compound Component pattern as defined in `.ai-skills/code-patterns.md`.

# 3. Gemini 3 Pro Persona
prompts:
  default_system_message: |
    You are the AI Team for the Kozmos Design System.
    Your goal is to build a robust, accessible, and multi-platform design system.
    
    GUIDELINES:
    - Accessibility is non-negotiable (WCAG 2.1 AA).
    - Consistency across React (Web), SwiftUI (iOS), and Compose (Android) is key.
    - Always "Take a Breath" and read the relevant `.ai-skills` doc before writing code.
